<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forcing Access...</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .log {
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>🔓 SYSTEM OVERRIDE</h1>
    <h2 id="status">Injecting Keys...</h2>
    <div class="log" id="log"></div>

    <script>
        const log = document.getElementById('log');
        function addLog(msg) {
            log.innerHTML += `> ${msg}<br>`;
            console.log(msg);
        }

        setTimeout(() => {
            try {
                // 1. Set Session Storage
                sessionStorage.setItem('authToken', 'valid');
                addLog('SessionStorage: Token Set');

                // 2. Set Local Storage (Backup)
                localStorage.setItem('authToken', 'valid');
                addLog('LocalStorage: Token Set');

                // 3. Clear any potential blocks
                localStorage.removeItem('taurus_lockout_until');
                localStorage.removeItem('taurus_attempts');
                addLog('Lockouts Cleared');

                // 4. Redirect
                document.getElementById('status').innerText = "ACCESS GRANTED. Redirecting...";
                document.getElementById('status').style.color = "gold";

                addLog('Redirecting to admin.html in 1s...');

                setTimeout(() => {
                    window.location.replace('admin.html');
                }, 1000);

            } catch (e) {
                document.getElementById('status').innerText = "ERROR: " + e.message;
                document.getElementById('status').style.color = "red";
            }
        }, 500);
    </script>
</body>

</html>
