<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taurus Gateway | Startpage</title>
  <link rel="icon" href="assets/favicon_transparent.svg" type="image/svg+xml">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505}
    iframe{display:block;width:100%;height:100%;border:0;background:#050505}
  </style>
</head>
<body>
  <iframe id="taurus-gateway-frame" src="gateway.html?v=20260726-3" title="Taurus Security Gateway" allow="publickey-credentials-get *"></iframe>
  <script>
    (function () {
      const START_ORIGIN = 'https://start.omeryigitler.com';
      const frame = document.getElementById('taurus-gateway-frame');
      let handoffStarted = false;
      let installTimer = null;

      function base64Url(bytes) {
        let binary = '';
        bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      }

      function randomVerifier() {
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        return base64Url(bytes);
      }

      async function verifierHash(verifier) {
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        return base64Url(new Uint8Array(digest));
      }

      function safeReturnTarget() {
        try {
          const raw = new URLSearchParams(window.location.search).get('return') || START_ORIGIN + '/';
          const target = new URL(raw);
          return target.origin === START_ORIGIN ? target.href : START_ORIGIN + '/';
        } catch (_) {
          return START_ORIGIN + '/';
        }
      }

      function postTicket(handoffToken, verifier) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = START_ORIGIN + '/api/gateway/session';
        form.style.display = 'none';

        const ticketInput = document.createElement('input');
        ticketInput.type = 'hidden';
        ticketInput.name = 'handoffToken';
        ticketInput.value = handoffToken;

        const verifierInput = document.createElement('input');
        verifierInput.type = 'hidden';
        verifierInput.name = 'verifier';
        verifierInput.value = verifier;

        const returnInput = document.createElement('input');
        returnInput.type = 'hidden';
        returnInput.name = 'return';
        returnInput.value = safeReturnTarget();

        form.append(ticketInput, verifierInput, returnInput);
        document.body.appendChild(form);
        form.submit();
      }

      function childStatus(message, isError) {
        try {
          if (isError && typeof frame.contentWindow.failAuth === 'function') {
            frame.contentWindow.failAuth(message);
          } else if (typeof frame.contentWindow.showStatus === 'function') {
            frame.contentWindow.showStatus(message, Boolean(isError));
          }
        } catch (_) {}
      }

      async function issueTicket(customToken) {
        if (!customToken || handoffStarted) return;
        handoffStarted = true;
        if (installTimer) window.clearInterval(installTimer);
        childStatus('Secure session is being created...', false);

        try {
          const verifier = randomVerifier();
          const hash = await verifierHash(verifier);
          const response = await fetch('/api/csp-report?action=handoff_issue', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            cache: 'no-store',
            body: JSON.stringify({ customToken, target: 'startpage', verifierHash: hash })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.handoffToken) {
            const reason = data?.error?.message || data?.error || 'Ticket issue failed';
            throw new Error(reason);
          }
          postTicket(data.handoffToken, verifier);
        } catch (error) {
          console.error('Startpage gateway handoff failed:', error);
          handoffStarted = false;
          childStatus('Secure handoff failed. Retry connection.', true);
          installGatewayHandoff();
          installTimer = window.setInterval(installGatewayHandoff, 250);
        }
      }

      function installGatewayHandoff() {
        try {
          const child = frame.contentWindow;
          if (!child || handoffStarted) return;
          child.grantAccess = issueTicket;
        } catch (error) {
          console.error('Taurus Gateway handoff could not be installed:', error);
        }
      }

      frame.addEventListener('load', installGatewayHandoff);
      installTimer = window.setInterval(installGatewayHandoff, 250);
      window.addEventListener('pagehide', () => {
        if (installTimer) window.clearInterval(installTimer);
      }, { once: true });
      installGatewayHandoff();
    })();
  </script>
</body>
</html>
