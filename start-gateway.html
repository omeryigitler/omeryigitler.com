<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taurus Gateway | Startpage</title>
  <link rel="icon" href="assets/favicon_transparent.svg" type="image/svg+xml">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505}
    iframe{display:block;width:100%;height:100%;border:0;background:#050505}
  </style>
</head>
<body>
  <iframe id="taurus-gateway-frame" src="gateway.html" title="Taurus Security Gateway" allow="publickey-credentials-get *"></iframe>
  <script>
    (function () {
      const START_ORIGIN = 'https://start.omeryigitler.com';
      const frame = document.getElementById('taurus-gateway-frame');
      let handoffStarted = false;

      function safeReturnTarget() {
        try {
          const raw = new URLSearchParams(window.location.search).get('return') || START_ORIGIN + '/';
          const target = new URL(raw);
          return target.origin === START_ORIGIN ? target.href : START_ORIGIN + '/';
        } catch (_) {
          return START_ORIGIN + '/';
        }
      }

      function postSession(customToken) {
        if (!customToken || handoffStarted) return;
        handoffStarted = true;

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = START_ORIGIN + '/api/gateway/session';
        form.style.display = 'none';

        const tokenInput = document.createElement('input');
        tokenInput.type = 'hidden';
        tokenInput.name = 'customToken';
        tokenInput.value = customToken;

        const returnInput = document.createElement('input');
        returnInput.type = 'hidden';
        returnInput.name = 'return';
        returnInput.value = safeReturnTarget();

        form.append(tokenInput, returnInput);
        document.body.appendChild(form);
        form.submit();
      }

      function installGatewayHandoff() {
        try {
          const child = frame.contentWindow;
          if (!child) return;

          child.grantAccess = function (customToken) {
            postSession(customToken);
          };
        } catch (error) {
          console.error('Taurus Gateway handoff could not be installed:', error);
        }
      }

      frame.addEventListener('load', installGatewayHandoff);
      const guard = window.setInterval(installGatewayHandoff, 500);
      window.setTimeout(() => window.clearInterval(guard), 15000);
      installGatewayHandoff();
    })();
  </script>
</body>
</html>
