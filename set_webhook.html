<!DOCTYPE html>
<html>

<head>
    <title>Set Telegram Webhook</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #111;
            color: #fff;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 300px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #FCD535;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            color: #aaa;
            font-family: monospace;
        }

        .success {
            color: #4ade80 !important;
        }

        .error {
            color: #ef4444 !important;
        }
    </style>
</head>

<body>
    <h2>🚀 Telegram Webhook Switcher</h2>
    <p>Use this to switch between Vercel and Netlify.</p>

    <label>New Site URL:</label><br>
    <input type="text" id="siteUrl" placeholder="https://your-site-name.netlify.app">
    <br><br>
    <button onclick="setWebhook()">Set Webhook</button>

    <div id="result">Waiting...</div>

    <script>
        const BOT_TOKEN = '8567285538:AAHKfo8bqee43rprC-GCv3Je423R57YQkCE';

        async function setWebhook() {
            let url = document.getElementById('siteUrl').value.trim();
            if (!url) return alert("Enter URL!");

            // Remove trailing slash
            if (url.endsWith('/')) url = url.slice(0, -1);

            // Determine if Netlify or Vercel based on domain
            let webhookPath = '';
            if (url.includes('netlify.app')) {
                webhookPath = '/.netlify/functions/webhook';
            } else {
                webhookPath = '/api/webhook';
            }

            const fullUrl = url + webhookPath;
            const target = `https://api.telegram.org/bot${BOT_TOKEN}/setWebhook?url=${fullUrl}`;

            document.getElementById('result').innerText = `Setting to: ${fullUrl}...`;

            try {
                // We use a direct link open because fetch might be blocked by CORS on local file
                window.open(target, '_blank');
                document.getElementById('result').innerHTML = `<span class="success">Check the new tab! If it says "Wait...", success.</span>`;
            } catch (e) {
                document.getElementById('result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        }
    </script>
</body>

</html>
