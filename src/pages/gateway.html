            position: absolute;

        /* MASTER CSS (Unified Design System - Hardcoded for Stability) */
        .taurus-master-panel {
            background: rgba(10, 10, 10, 0.4);

        @media (min-width: 768px) {

        /* Standard Button Container (Action Button) */

            width: 100%;

        .animate-fade-in {

        @keyframes fadeIn {

                opacity: 1;

        /* TAURUS VAULT — isolated from the public portfolio */
        .taurus-master-panel{position:relative;padding:2rem 1.5rem 1.65rem;max-width:430px;height:min(790px,94dvh)!important;max-height:94dvh;border-radius:2.2rem;background:linear-gradient(145deg,#121312,#070807 70%);border:1px solid #343630;box-shadow:0 28px 95px #000b,inset 0 1px #fff1;justify-content:flex-start;overflow:hidden}
        .taurus-master-panel:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:linear-gradient(90deg,transparent 49.7%,#ffffff06 50%,transparent 50.3%),repeating-linear-gradient(0deg,transparent 0 46px,#ffffff06 47px 48px)}
        .vault-header{position:relative;z-index:2;margin:0 auto 20px;text-align:center;font:600 10px/1.5 Manrope,sans-serif;letter-spacing:.23em;color:#a5a6a1}
        .vault-stage{position:relative;z-index:2;width:min(315px,72vw,36dvh);aspect-ratio:1;flex-shrink:0;margin:0 auto 18px;isolation:isolate}
        .vault-pipe{position:absolute;z-index:-1;width:30%;height:27%;border:9px solid #383b39;border-radius:28px;border-right:0;border-bottom:0;box-shadow:inset 2px 2px 0 #676a62,0 0 0 3px #131412}
        .vault-pipe.left{left:-16%;top:3%;transform:rotate(-4deg)}
        .vault-pipe.right{right:-17%;bottom:4%;transform:rotate(180deg)}
        .vault-pipe:after{content:"";position:absolute;inset:3px;border-top:2px solid #e4c21a7d;border-left:2px solid #e4c21a7d;border-radius:18px;opacity:.55}
        .vault-door{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 35% 26%,#4b4d46 0%,#252725 28%,#0a0b0b 60%,#383a36 80%,#080909 100%);border:9px ridge #555850;box-shadow:0 16px 24px #000c,0 0 0 4px #101110,0 0 0 6px #56584e,inset 0 0 0 6px #141613,inset 0 0 30px #000;transform-origin:91% 50%;will-change:transform,opacity}
        .vault-ring{position:absolute;inset:10%;border:13px solid #292b28;border-radius:50%;box-shadow:0 0 0 2px #79796b,inset 0 0 0 2px #767668,inset 0 10px 22px #0008}
        .vault-ring:after{content:"";position:absolute;inset:-16px;border-radius:50%;border:3px dashed #c9ad16;opacity:.58}
        .vault-spokes{position:absolute;inset:26%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#63655e 0deg 6deg,#151615 7deg 10deg,transparent 11deg 60deg);box-shadow:0 0 0 8px #252726,0 0 0 10px #777b71}
        .vault-flow{position:absolute;inset:7%;border-radius:50%;border:3px solid transparent;border-top-color:#ffdb00;border-left-color:#ffdb0080;filter:drop-shadow(0 0 4px #ffd00075);opacity:.6;transform:rotate(-45deg)}
        .vault-logo{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;border-radius:50%;background:#060706;display:grid;place-items:center;border:3px solid #e3bc00;box-shadow:0 0 0 7px #131512,0 0 0 9px #cbb21e,0 0 20px #ffdf0033;pointer-events:none}
        .vault-logo img{width:90%;height:90%;object-fit:contain;border:0!important;box-shadow:none!important;border-radius:50%}
        .vault-caption{position:relative;z-index:2;font:700 clamp(17px,4.5vw,26px)/1.15 Syncopate,sans-serif;letter-spacing:.09em;color:#ffda00;text-align:center;margin:0 0 8px}
        .vault-subtitle{position:relative;z-index:2;text-align:center;color:#898b83;font:500 9px/1.4 Manrope,sans-serif;letter-spacing:.25em;margin-bottom:10px}
        .vault-stage.is-unlocking .vault-flow{animation:vaultCurrent .7s ease-in forwards}
        .vault-stage.is-unlocking .vault-ring{animation:vaultTurn 1s .65s ease-in-out forwards}
        .vault-stage.is-unlocking .vault-door{animation:vaultOpen 1.1s 1.45s cubic-bezier(.25,.1,.15,1) forwards}
        @keyframes vaultCurrent{from{transform:rotate(-65deg);opacity:.15}to{transform:rotate(220deg);opacity:1}}
        @keyframes vaultTurn{to{transform:rotate(42deg)}}
        @keyframes vaultOpen{0%{transform:perspective(800px) rotateY(0);opacity:1}100%{transform:perspective(800px) rotateY(-76deg);opacity:.28}}
        .vault-stage.is-unlocking .vault-logo{box-shadow:0 0 0 7px #131512,0 0 0 9px #cbb21e,0 0 24px #ffd0008c}
        .vault-stage.is-unlocking .vault-pipe:after{animation:vaultCurrent 1s ease-out forwards}
        .taurus-master-panel #challenge-container{margin-top:4px!important;min-height:0}
        .taurus-master-panel #challenge-container > div:first-child{margin-bottom:12px!important;gap:6px}

        .vault-unlocking #challenge-container{pointer-events:none}
        @media(max-height:740px){.taurus-master-panel{padding-top:13px;padding-bottom:13px}.vault-header{margin-bottom:8px}.vault-stage{width:min(240px,57vw,32dvh);margin-bottom:9px}.vault-subtitle{margin-bottom:4px}}
        @media(prefers-reduced-motion:reduce){.vault-stage.is-unlocking .vault-flow,.vault-stage.is-unlocking .vault-ring,.vault-stage.is-unlocking .vault-door,.vault-stage.is-unlocking .vault-pipe:after{animation-duration:.01ms!important;animation-delay:0ms!important}}

<body
    class="bg-obsidian text-white font-body h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-taurusGold selection:text-black">

    <div class="fixed inset-0 w-full h-full grid-bg -z-10 opacity-40"></div>

    <div
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-taurusGold rounded-full blur-[150px] -z-10 opacity-5">

        <!-- Error/Lockout Display -->
        <div id="error-container" class="hidden flex-col items-center animate-fade-in text-center">
            <div
                class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mb-4 border border-red-500/20">
                <i data-lucide="x-circle" class="w-8 h-8 text-red-500"></i>
            </div>

            <p id="error-msg" class="text-xs text-gray-500 mb-6">Verification failed.</p>
            <button onclick="location.reload()"
                class="px-6 py-2 border border-white/10 hover:bg-white/5 rounded text-xs text-gray-400 uppercase tracking-widest transition-colors">
                Retry Connection

    </div>



    <div id="error-display"
        class="hidden mt-4 p-3 bg-red-900/50 text-red-200 rounded-lg text-sm border border-red-500/30 backdrop-blur-sm">
    </div>

    <!-- DEBUG CONSOLE (HIDDEN AS REQUESTED) -->
    <div id="debug-console"
        class="fixed bottom-0 left-0 w-full h-40 bg-black/90 text-green-400 text-[10px] font-mono p-4 overflow-y-auto z-50 text-left border-t border-green-900/50 shadow-2xl"
        style="display: none !important;">
        <div class="mb-2 text-xs border-b border-green-900/50 pb-1">CONSOLE OUTPUT (Screenshot this if stuck):</div>
    </div>

    <script>
        lucide.createIcons();

        // --- UNIFIED WEBHOOK ARCHITECTURE ---
        let challengeCode = null;
        const REQ_ID = createRequestId();
        let pollingInterval = null;
        let passkeyInFlight = false;
        let passkeySupported = false;
        let telegramStarted = false;

        const debugLog = document.getElementById('debug-console');
        const log = (msg) => {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            debugLog.innerHTML += `<div class="mb-1"><span class="opacity-50">[${time}]</span> ${msg}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
        };

        log("System Booting...");
        log(`Generated REQ_ID: ${REQ_ID}`);

        function createRequestId() {
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
        }

        // 1. Initialize & Load Config
        (async function init() {
            if (checkLockout()) return;

            try {
                if (firebase.apps.length === 0) firebase.initializeApp(window.firebaseConfig);
                passkeySupported = initPasskeyUI();
                const passkeyEnabled = passkeySupported && await checkPasskeyStatus();

                if (passkeyEnabled) {
                    showPasskeyMode();
                } else {
                    startAuthentication();
                }

            } catch (error) {
                console.error('Init Error:', error);
                log(`CRITICAL INIT ERROR: ${error.message}`);
                showError('Configuration Failed. Contact Admin.');
            }
        })();

        function initPasskeyUI() {
            const passkeyBtn = document.getElementById('passkey-btn');
            const telegramFallbackBtn = document.getElementById('telegram-fallback-btn');
            const webauthn = window.SimpleWebAuthnBrowser;
            if (!passkeyBtn || !webauthn?.browserSupportsWebAuthn?.()) {
                log('Passkey unavailable on this browser.');
                return false;
            }

            passkeyBtn.addEventListener('click', startPasskeyAuthentication);
            telegramFallbackBtn?.addEventListener('click', startAuthentication);
            log('Passkey UI ready.');
            lucide.createIcons();
            return true;
        }

        async function checkPasskeyStatus() {
            try {
                const response = await fetch(`/api/gateway?action=passkey_status&t=${Date.now()}`);
                const data = await response.json().catch(() => ({}));
                return response.ok && data.enabled;
            } catch (error) {
                console.warn('Passkey status unavailable:', error);
                return false;
            }
        }

        function showPasskeyMode() {
            const passkeyBtn = document.getElementById('passkey-btn');
            const telegramFallbackBtn = document.getElementById('telegram-fallback-btn');
            document.getElementById('telegram-code-box').classList.add('hidden');
            passkeyBtn.classList.remove('hidden');
            passkeyBtn.classList.add('flex');
            telegramFallbackBtn.classList.remove('hidden');
            telegramFallbackBtn.classList.add('flex');
            showStatus('Passkey Ready. Telegram is fallback.');
            lucide.createIcons();
        }

        function showTelegramMode() {
            document.getElementById('telegram-code-box').classList.remove('hidden');
            document.getElementById('telegram-fallback-btn').classList.add('hidden');
            showStatus('Telegram Verification Request Sent');
        }

        async function startPasskeyAuthentication() {
            if (passkeyInFlight) return;
            const webauthn = window.SimpleWebAuthnBrowser;
            const passkeyBtn = document.getElementById('passkey-btn');

            if (!webauthn?.startAuthentication) {
                showError('Passkey not supported on this browser.');
                return;
            }

            passkeyInFlight = true;
            const originalHtml = passkeyBtn.innerHTML;
            passkeyBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Scanning</span>';
            lucide.createIcons();

            try {
                const optionsResponse = await fetch('/api/gateway?action=passkey_challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reqId: REQ_ID,
                        userAgent: navigator.userAgent,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                    })
                });
                const optionsJSON = await optionsResponse.json().catch(() => ({}));
                if (!optionsResponse.ok) throw new Error(optionsJSON.error || 'Passkey challenge failed');

                const authResponse = await webauthn.startAuthentication({ optionsJSON });
                const verifyResponse = await fetch('/api/gateway?action=passkey_verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reqId: REQ_ID,
                        response: authResponse
                    })
                });
                const verifyJSON = await verifyResponse.json().catch(() => ({}));
                if (!verifyResponse.ok || !verifyJSON.verified || !verifyJSON.customToken) {
                    throw new Error(verifyJSON.error || 'Passkey verification failed');
                }

                log('PASSKEY: VERIFIED. Unlocking...');
                grantAccess(verifyJSON.customToken);
            } catch (error) {
                console.warn('Passkey authentication failed:', error);
                log(`PASSKEY FAILED: ${error.message}`);
                showError('Passkey failed. Use Telegram approval below.');
                document.getElementById('telegram-fallback-btn')?.classList.remove('hidden');
                document.getElementById('telegram-fallback-btn')?.classList.add('flex');
                passkeyBtn.innerHTML = originalHtml;
                lucide.createIcons();
            } finally {
                passkeyInFlight = false;
            }
        }

        // 2. Start Auth Process
        async function startAuthentication() {
            if (telegramStarted) return;
            telegramStarted = true;
            showTelegramMode();
            log("Registering Request via Backend...");

            try {
                const response = await fetch('/api/gateway?action=auth_init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reqId: REQ_ID,
                        action: 'auth_init',
                        userAgent: navigator.userAgent,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                    })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || 'Auth initialization failed');
                }

                challengeCode = data.challengeCode;
                if (!challengeCode) {
                    throw new Error('Challenge code missing from backend response');
                }

                document.getElementById('challenge-code').innerText = challengeCode;
                showStatus('Telegram Verification Request Sent');
                log("Backend Registration: SUCCESS");
                log(`Challenge Code: ${challengeCode}`);
            } catch (err) {
                log(`Backend Registration FAILED: ${err.message}`);
                console.error("Backend Init Failed", err);
                showError('Connection Failed. Check server settings.');
                return;
            }

            log("Starting Status Polling Loop (2000ms)...");

            pollingInterval = setInterval(async () => {
                try {
                    const url = `/api/gateway?action=check_status&reqId=${REQ_ID}&t=${Date.now()}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.error || "API_Unavailable");

                    if (data.status === 'approved') {
                        log("STATUS: APPROVED. Unlocking...");
                        clearInterval(pollingInterval);
                        grantAccess(data.customToken);
                    } else if (data.status === 'denied') {
                        log("STATUS: DENIED.");
                        clearInterval(pollingInterval);
                        failAuth("Incorrect Code Selected");
                        recordFailedAttempt();
                    } else if (data.status === 'expired') {
                        log("STATUS: EXPIRED.");
                        clearInterval(pollingInterval);
                        failAuth("Request Expired");
                        recordFailedAttempt();
                    }
                } catch (e) {
                    console.warn("Status check failed:", e);
                }
            }, 2000); // Check every 2 seconds
        }

        async function grantAccess(customToken) {
            if (pollingInterval) clearInterval(pollingInterval);

            if (!customToken) {
                failAuth("Secure token missing");
                return;
            }

            try {
                await firebase.auth().signInWithCustomToken(customToken);
            } catch (error) {
                console.error("Firebase custom token sign-in failed:", error);
                failAuth("Secure session failed");
                return;
            }

            // Play the mechanical reveal only after a valid Firebase sign-in.
            sessionStorage.setItem('authToken', 'valid');
            localStorage.setItem('authToken', 'valid');
            localStorage.removeItem('authLockout');
            if (window.taurus_set_internal) window.taurus_set_internal();
            document.getElementById('vault-stage')?.classList.add('is-unlocking');
            document.getElementById('main-panel')?.classList.add('vault-unlocking');
            showStatus('SECURE ACCESS GRANTED');
            const isStart = new URLSearchParams(location.search).get('target') === 'startpage';
            const finish = () => {
                if (isStart && window.parent !== window) {
                    window.parent.postMessage({ type: 'taurus-vault-complete' }, window.location.origin);
                } else {
                    window.location.assign('admin.html');
                }
            };
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
            else setTimeout(finish, 2700);
        }

        function failAuth(reason) {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('challenge-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            document.getElementById('error-container').classList.add('flex');
            document.getElementById('error-msg').innerText = reason;
        }

        function showError(msg) {
            showStatus(msg, true);
        }

        function showStatus(msg, isError = false) {
            const statusDesc = document.getElementById('status-desc');
            statusDesc.innerText = msg;
            statusDesc.classList.toggle('text-red-500', Boolean(isError));
        }

        // --- LOCKOUT LOGIC ---
        function checkLockout() {
            const lockoutData = JSON.parse(localStorage.getItem('authLockout') || '{}');
            const now = Date.now();

            if (lockoutData.lockedUntil && now < lockoutData.lockedUntil) {
                const remainingMin = Math.ceil((lockoutData.lockedUntil - now) / 60000);
                document.getElementById('main-panel').innerHTML = `
                    <div class="text-center p-8">
                        <i data-lucide="shield-alert" class="w-16 h-16 text-red-500 mx-auto mb-4"></i>
                        <h2 class="font-display text-xl text-red-500 font-bold mb-2">SYSTEM LOCKED</h2>
                        <p class="text-gray-400 text-xs mb-4">Too many failed attempts</p>
                        <p class="text-white font-mono text-lg">${remainingMin}m remaining</p>
                    </div>
                `;
                lucide.createIcons();
                return true;
            }
            return false;
        }

        function recordFailedAttempt() {
            const lockoutData = JSON.parse(localStorage.getItem('authLockout') || '{}');
            const now = Date.now();

            // Reset if expired
            if (lockoutData.lockedUntil && now > lockoutData.lockedUntil) {
                lockoutData.attempts = 0;
                lockoutData.lockedUntil = null;
            }

            lockoutData.attempts = (lockoutData.attempts || 0) + 1;

            if (lockoutData.attempts >= 3) {
                lockoutData.lockedUntil = now + (5 * 60000); // 5 mins
            }

            localStorage.setItem('authLockout', JSON.stringify(lockoutData));
        }

    </script>
</body>
