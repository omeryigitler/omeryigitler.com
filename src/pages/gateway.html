<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Security Gateway | Ömer YİĞİTLER</title>
    <link rel="icon" href="/favicon-20260806.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="/favicon-32x32-20260806.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16x16-20260806.png" type="image/png" sizes="16x16">
    <link rel="alternate icon" href="/favicon-20260806.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon-20260806.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest?v=20260806">
    <meta name="theme-color" content="#050505">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="assets/js/gateway-firebase.js"></script>
    <script src="/assets/vendor/simplewebauthn-browser-13.3.0.js"></script>

    <link rel="stylesheet" href="assets/css/gateway.css">
</head>

<body>
  <div class="gateway" id="vault-stage">
    <header class="masthead">
      <span class="wordmark">ÖMER YİĞİTLER<span>.</span></span>
      <a href="/" target="_top">Portfolio <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <div class="brand-art" aria-hidden="true">
        <div class="brand-print"><img src="/favicon_taurus.svg" width="392" height="352" alt=""></div>
      </div>
      <section class="access" aria-labelledby="status-title">
        <h1 id="status-title">Studio<br><em>access.</em></h1>
        <p class="instruction">Choose a method to sign in.</p>
        <p id="status-desc" role="status" aria-live="polite">Preparing secure access…</p>
        <div id="challenge-container" class="actions">
          <button id="passkey-btn" type="button" class="hidden method">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="4"/><path d="m11 12 8 8 3-3-2-2-2 2"/></svg>
            Passkey <span aria-hidden="true">↗</span>
          </button>
          <button id="telegram-fallback-btn" type="button" class="hidden method">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 18-7-4 18-6-6-4 3v-6zM7 12l10-6-6 9"/></svg>
            Telegram <span aria-hidden="true">↗</span>
          </button>
          <div id="telegram-code-box" class="hidden" aria-live="polite"><span id="challenge-code"></span></div>
          <button id="cancel-auth" type="button" class="hidden text-button">Choose another method</button>
        </div>
        <div id="error-container" class="hidden" role="alert">
          <p id="error-msg"></p>
          <button id="retry-auth" type="button" class="method">Try again <span aria-hidden="true">↗</span></button>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/js/gateway.js" defer></script>
</body>
</html>
