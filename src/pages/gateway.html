<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Security Gateway | Ömer YİĞİTLER</title>
    <link rel="icon" href="/favicon-20260806.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="/favicon-32x32-20260806.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16x16-20260806.png" type="image/png" sizes="16x16">
    <link rel="alternate icon" href="/favicon-20260806.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon-20260806.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest?v=20260806">
    <meta name="theme-color" content="#050505">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="assets/js/gateway-firebase.js"></script>
    <script src="/assets/vendor/simplewebauthn-browser-13.3.0.js"></script>

    <link rel="stylesheet" href="assets/css/gateway.css">
</head>

<body>
  <main class="vault-screen">
    <section class="vault-access" aria-labelledby="status-title">
      <img id="vault-stage" class="vault-mark" src="/favicon_taurus.svg" alt="" width="128" height="115">
      <h1 id="status-title">TAURUS VAULT</h1>
      <p id="status-desc" role="status" aria-live="polite">Preparing secure access…</p>
      <div id="challenge-container" class="vault-actions">
        <button id="passkey-btn" type="button" class="hidden primary">Unlock with passkey</button>
        <button id="telegram-fallback-btn" type="button" class="hidden secondary">Continue with Telegram</button>
        <div id="telegram-code-box" class="hidden vault-code" aria-live="polite">
          <span id="challenge-code"></span>
        </div>
        <button id="cancel-auth" type="button" class="hidden secondary">Choose another method</button>
      </div>
      <div id="error-container" class="hidden" role="alert">
        <p id="error-msg"></p>
        <button id="retry-auth" type="button" class="primary">Try again</button>
      </div>
    </section>
  </main>
  <script src="/assets/js/gateway.js" defer></script>
</body>
</html>
