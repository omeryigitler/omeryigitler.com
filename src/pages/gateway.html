<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Security Gateway | Ömer YİĞİTLER</title>
    <link rel="icon" href="/favicon-20260806.svg" type="image/svg+xml" sizes="any">
    <link rel="icon" href="/favicon-32x32-20260806.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16x16-20260806.png" type="image/png" sizes="16x16">
    <link rel="alternate icon" href="/favicon-20260806.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon-20260806.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest?v=20260806">
    <meta name="theme-color" content="#050505">
    <link rel="stylesheet" href="assets/css/gateway.css">
    <script src="/assets/js/gateway-intro.js" defer></script>
    <!-- Firebase SDK -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script defer src="assets/js/gateway-firebase.js"></script>
    <script defer src="/assets/vendor/simplewebauthn-browser-13.3.0.js"></script>
</head>

<body>
  <canvas class="intro" aria-hidden="true"></canvas>
  <main class="gateway" id="vault-stage">
      <section class="access" aria-label="Studio sign-in">
        <div class="logo-ring">
          <img class="logo" src="/assets/gateway/startpage-logo.png" width="1024" height="1024" alt="Ömer Yiğitler">
        </div>
        <p id="status-desc" role="status" aria-live="polite">Preparing secure access…</p>
        <div id="challenge-container" class="actions">
          <div class="method-bar">
            <button id="passkey-btn" type="button" class="hidden method">
              <span class="method-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3" />
                  <path d="M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6" />
                  <path d="M12 11v2a14 14 0 0 0 2.5 8" />
                  <path d="M8 15a18 18 0 0 0 1.8 6" />
                  <path d="M4.9 19a22 22 0 0 1 -.9 -7v-1a8 8 0 0 1 12 -6.95" />
                </svg>
              </span>
              Passkey
            </button>
            <button id="telegram-fallback-btn" type="button" class="hidden method">
              <span class="method-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4" />
                </svg>
              </span>
              Telegram
            </button>
          </div>
          <div id="telegram-code-box" class="hidden" aria-live="polite"><span id="challenge-code"></span></div>
          <button id="cancel-auth" type="button" class="hidden text-button">Choose another method</button>
        </div>
        <div id="error-container" class="hidden" role="alert">
          <p id="error-msg"></p>
          <button id="retry-auth" type="button" class="method">Try again</button>
        </div>
      </section>
  </main>
  <script src="/assets/js/gateway.js" defer></script>
</body>
</html>
