    <script>
        lucide.createIcons();

        // --- UNIFIED WEBHOOK ARCHITECTURE ---
        let challengeCode = null;
        const REQ_ID = createRequestId();
        let pollingInterval = null;
        let passkeyInFlight = false;
        let passkeySupported = false;
        let telegramStarted = false;

        const debugLog = document.getElementById('debug-console');
        const log = (msg) => {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            debugLog.innerHTML += `<div class="mb-1"><span class="opacity-50">[${time}]</span> ${msg}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
        };

        log("System Booting...");
        log(`Generated REQ_ID: ${REQ_ID}`);

        function createRequestId() {
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
        }

        // 1. Initialize & Load Config
        (async function init() {
            if (checkLockout()) return;

            try {
                if (firebase.apps.length === 0) firebase.initializeApp(window.firebaseConfig);
                passkeySupported = initPasskeyUI();
                const passkeyEnabled = passkeySupported && await checkPasskeyStatus();

                if (passkeyEnabled) {
                    showPasskeyMode();
                } else {
                    startAuthentication();
                }

            } catch (error) {
                console.error('Init Error:', error);
                log(`CRITICAL INIT ERROR: ${error.message}`);
                showError('Configuration Failed. Contact Admin.');
            }
        })();

        function initPasskeyUI() {
            const passkeyBtn = document.getElementById('passkey-btn');
            const telegramFallbackBtn = document.getElementById('telegram-fallback-btn');
            const webauthn = window.SimpleWebAuthnBrowser;
            if (!passkeyBtn || !webauthn?.browserSupportsWebAuthn?.()) {
                log('Passkey unavailable on this browser.');
                return false;
            }

            passkeyBtn.addEventListener('click', startPasskeyAuthentication);
            telegramFallbackBtn?.addEventListener('click', startAuthentication);
            log('Passkey UI ready.');
            lucide.createIcons();
            return true;
        }

        async function checkPasskeyStatus() {
            try {
                const response = await fetch(`/api/gateway?action=passkey_status&t=${Date.now()}`);
                const data = await response.json().catch(() => ({}));
                return response.ok && data.enabled;
            } catch (error) {
                console.warn('Passkey status unavailable:', error);
                return false;
            }
        }

        function showPasskeyMode() {
            const passkeyBtn = document.getElementById('passkey-btn');
            const telegramFallbackBtn = document.getElementById('telegram-fallback-btn');
            document.getElementById('telegram-code-box').classList.add('hidden');
            passkeyBtn.classList.remove('hidden');
            passkeyBtn.classList.add('flex');
            telegramFallbackBtn.classList.remove('hidden');
            telegramFallbackBtn.classList.add('flex');
            showStatus('Passkey Ready. Telegram is fallback.');
            lucide.createIcons();
        }

        function showTelegramMode() {
            document.getElementById('telegram-code-box').classList.remove('hidden');
            document.getElementById('telegram-fallback-btn').classList.add('hidden');
            showStatus('Telegram Verification Request Sent');
        }

        async function startPasskeyAuthentication() {
            if (passkeyInFlight) return;
            const webauthn = window.SimpleWebAuthnBrowser;
            const passkeyBtn = document.getElementById('passkey-btn');

            if (!webauthn?.startAuthentication) {
                showError('Passkey not supported on this browser.');
                return;
            }

            passkeyInFlight = true;
            const originalHtml = passkeyBtn.innerHTML;
            passkeyBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Scanning</span>';
            lucide.createIcons();

            try {
                const optionsResponse = await fetch('/api/gateway?action=passkey_challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reqId: REQ_ID,
                        userAgent: navigator.userAgent,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                    })
                });
                const optionsJSON = await optionsResponse.json().catch(() => ({}));
                if (!optionsResponse.ok) throw new Error(optionsJSON.error || 'Passkey challenge failed');

                const authResponse = await webauthn.startAuthentication({ optionsJSON });
                const verifyResponse = await fetch('/api/gateway?action=passkey_verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reqId: REQ_ID,
                        response: authResponse
                    })
                });
                const verifyJSON = await verifyResponse.json().catch(() => ({}));
                if (!verifyResponse.ok || !verifyJSON.verified || !verifyJSON.customToken) {
                    throw new Error(verifyJSON.error || 'Passkey verification failed');
                }

                log('PASSKEY: VERIFIED. Unlocking...');
                grantAccess(verifyJSON.customToken);
            } catch (error) {
                console.warn('Passkey authentication failed:', error);
                log(`PASSKEY FAILED: ${error.message}`);
                showError('Passkey failed. Use Telegram approval below.');
                document.getElementById('telegram-fallback-btn')?.classList.remove('hidden');
                document.getElementById('telegram-fallback-btn')?.classList.add('flex');
                passkeyBtn.innerHTML = originalHtml;
                lucide.createIcons();
            } finally {
                passkeyInFlight = false;
            }
        }

        // 2. Start Auth Process
        async function startAuthentication() {
            if (telegramStarted) return;
            telegramStarted = true;
            showTelegramMode();
            log("Registering Request via Backend...");

            try {
                const response = await fetch('/api/gateway?action=auth_init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reqId: REQ_ID,
                        action: 'auth_init',
                        userAgent: navigator.userAgent,
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                    })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || 'Auth initialization failed');
                }

                challengeCode = data.challengeCode;
                if (!challengeCode) {
                    throw new Error('Challenge code missing from backend response');
                }

                document.getElementById('challenge-code').innerText = challengeCode;
                showStatus('Telegram Verification Request Sent');
                log("Backend Registration: SUCCESS");
                log(`Challenge Code: ${challengeCode}`);
            } catch (err) {
                log(`Backend Registration FAILED: ${err.message}`);
                console.error("Backend Init Failed", err);
                showError('Connection Failed. Check server settings.');
                return;
            }

            log("Starting Status Polling Loop (2000ms)...");

            pollingInterval = setInterval(async () => {
                try {
                    const url = `/api/gateway?action=check_status&reqId=${REQ_ID}&t=${Date.now()}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.error || "API_Unavailable");

                    if (data.status === 'approved') {
                        log("STATUS: APPROVED. Unlocking...");
                        clearInterval(pollingInterval);
                        grantAccess(data.customToken);
                    } else if (data.status === 'denied') {
                        log("STATUS: DENIED.");
                        clearInterval(pollingInterval);
                        failAuth("Incorrect Code Selected");
                        recordFailedAttempt();
                    } else if (data.status === 'expired') {
                        log("STATUS: EXPIRED.");
                        clearInterval(pollingInterval);
                        failAuth("Request Expired");
                        recordFailedAttempt();
                    }
                } catch (e) {
                    console.warn("Status check failed:", e);
                }
            }, 2000); // Check every 2 seconds
        }

        async function grantAccess(customToken) {
            if (pollingInterval) clearInterval(pollingInterval);

            if (!customToken) {
                failAuth("Secure token missing");
                return;
            }

            try {
                await firebase.auth().signInWithCustomToken(customToken);
            } catch (error) {
                console.error("Firebase custom token sign-in failed:", error);
                failAuth("Secure session failed");
                return;
            }

            // INSTANT REDIRECT
            sessionStorage.setItem('authToken', 'valid');
            localStorage.setItem('authToken', 'valid');
            localStorage.removeItem('authLockout');
            if (window.taurus_set_internal) window.taurus_set_internal();
            const vault = document.getElementById('vault-stage');
            vault?.classList.add('is-unlocking');
            showStatus('SECURE ACCESS GRANTED');
            const finish = () => {
                if (new URLSearchParams(location.search).get('target') === 'startpage' && window.parent !== window) {
                    window.parent.postMessage({ type: 'taurus-vault-complete' }, location.origin);
                } else {
                    window.location.assign('admin.html');
                }
            };
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
            else setTimeout(finish, 2700);
        }

        function failAuth(reason) {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('challenge-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            document.getElementById('error-container').classList.add('flex');
            document.getElementById('error-msg').innerText = reason;
        }

        function showError(msg) {
            showStatus(msg, true);
        }

        function showStatus(msg, isError = false) {
            const statusDesc = document.getElementById('status-desc');
            statusDesc.innerText = msg;
            statusDesc.classList.toggle('text-red-500', Boolean(isError));
        }

        // --- LOCKOUT LOGIC ---
        function checkLockout() {
            const lockoutData = JSON.parse(localStorage.getItem('authLockout') || '{}');
            const now = Date.now();

            if (lockoutData.lockedUntil && now < lockoutData.lockedUntil) {
                const remainingMin = Math.ceil((lockoutData.lockedUntil - now) / 60000);
                document.getElementById('main-panel').innerHTML = `
                    <div class="text-center p-8">
                        <i data-lucide="shield-alert" class="w-16 h-16 text-red-500 mx-auto mb-4"></i>
                        <h2 class="font-display text-xl text-red-500 font-bold mb-2">SYSTEM LOCKED</h2>
                        <p class="text-gray-400 text-xs mb-4">Too many failed attempts</p>
                        <p class="text-white font-mono text-lg">${remainingMin}m remaining</p>
                    </div>
                `;
                lucide.createIcons();
                return true;
            }
            return false;
        }

        function recordFailedAttempt() {
            const lockoutData = JSON.parse(localStorage.getItem('authLockout') || '{}');
            const now = Date.now();

            // Reset if expired
            if (lockoutData.lockedUntil && now > lockoutData.lockedUntil) {
                lockoutData.attempts = 0;
                lockoutData.lockedUntil = null;
            }

            lockoutData.attempts = (lockoutData.attempts || 0) + 1;

            if (lockoutData.attempts >= 3) {
                lockoutData.lockedUntil = now + (5 * 60000); // 5 mins
            }

            localStorage.setItem('authLockout', JSON.stringify(lockoutData));
        }

    </script>
</body>
