<style>
:root{--gold:#ffd700;--muted:rgba(255,255,255,.64);--soft:rgba(255,255,255,.42)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Manrope,system-ui,sans-serif;background:radial-gradient(circle at top,rgba(255,215,0,.1),transparent 28rem),linear-gradient(rgba(255,215,0,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,215,0,.025) 1px,transparent 1px),#050505;background-size:auto,56px 56px,56px 56px,auto;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle,transparent 0%,rgba(5,5,5,.2) 40%,#050505 100%);pointer-events:none}.page{position:relative;z-index:1;width:min(100%,520px);margin:auto;padding:max(24px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}.hero{text-align:center;padding:8px 6px 18px}.logo{position:relative;width:112px;height:112px;margin:0 auto 18px;display:grid;place-items:center}.wave,.wave:before,.wave:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,215,0,.3);border-radius:999px}.wave{animation:w1 3s infinite ease-out;box-shadow:0 0 40px rgba(255,215,0,.14)}.wave:before{inset:-10px;animation:w2 3s infinite ease-out}.wave:after{inset:-20px;animation:w3 3s infinite ease-out}.logo-core{position:relative;z-index:2;width:74px;height:74px;border-radius:999px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(255,215,0,.24),rgba(255,215,0,.05) 52%),#090909;border:1px solid rgba(255,215,0,.36);box-shadow:0 0 36px rgba(255,215,0,.2),inset 0 0 18px rgba(255,215,0,.09)}.logo-core img{width:56px;height:56px;object-fit:contain}.tag{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;margin-bottom:16px;border-radius:999px;border:1px solid rgba(255,215,0,.28);background:rgba(255,215,0,.07);color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.tag:before,.tag:after{content:"";width:4px;height:4px;border-radius:999px;background:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.8)}h1{margin:0;font-family:Syncopate,sans-serif;font-size:clamp(26px,8vw,42px);line-height:1.05;letter-spacing:-.05em;text-transform:uppercase}h1 span{display:block;margin-top:4px;color:var(--gold);text-shadow:0 0 26px rgba(255,215,0,.16)}.lead{max-width:360px;margin:16px auto 0;color:var(--muted);font-size:13px;line-height:1.7}.loading{padding:40px 0;text-align:center;color:var(--soft);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.footer{text-align:center;padding:16px 4px 6px;color:var(--soft);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.footer span{color:var(--gold)}@keyframes w1{0%{transform:scale(.96);opacity:.9}70%{transform:scale(1.06);opacity:.14}100%{transform:scale(1.08);opacity:0}}@keyframes w2{0%{transform:scale(.96);opacity:.75}75%{transform:scale(1.12);opacity:.1}100%{transform:scale(1.18);opacity:0}}@keyframes w3{0%{transform:scale(.92);opacity:.45}78%{transform:scale(1.18);opacity:.06}100%{transform:scale(1.24);opacity:0}}
</style>
</head>
<body>
<main class="page">
<section class="hero"><div class="logo"><div class="wave"></div><div class="logo-core"><img src="assets/logo-96.webp" alt=""></div></div><div class="tag">QR Gateway</div><h1>Selected <span>Web Projects</span></h1><p class="lead">A mobile-first showcase of selected digital products, client websites and brand experiences designed by Ömer Yiğitler.</p></section>
<section id="qr-projects"><div class="loading">Loading projects...</div></section>
<footer class="footer">QR showcase by <span>Ömer Yiğitler</span></footer>
</main>
<script src="assets/js/public-projects.js?v=V1"></script>
</body>
</html>
