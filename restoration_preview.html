<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Taurus Security - Radical UI (Technical Precision)</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700;900&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        taurusGold: '#FFD700',
                        obsidian: '#050505',
                    },
                    fontFamily: {
                        display: ['Syncopate', 'sans-serif'],
                        manrope: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html,
        body {
            overflow: hidden !important;
            height: 100% !important;
            width: 100% !important;
            margin: 0;
            padding: 0;
            background: #050505;
            touch-action: none;
        }

        .grid-bg {
            background-image: radial-gradient(circle at center, transparent 0, #050505 100%),
                linear-gradient(rgba(255, 215, 0, 0.08) 1px, transparent 0),
                linear-gradient(90deg, rgba(255, 215, 0, 0.08) 1px, transparent 0);
            background-size: 100% 100%, 35px 35px, 35px 35px;
        }

        @keyframes custom-ping {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            70%,
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        .signal-wave {
            animation: custom-ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .signal-wave-delay {
            animation: custom-ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite 1.25s;
        }

        .no-jitter {
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(1.1);
            }
        }

        .glow-fx {
            animation: pulse-glow 4s infinite ease-in-out;
        }
    </style>
</head>

<body class="bg-obsidian text-white">

    <div
        class="fixed inset-0 z-[1000] bg-obsidian flex flex-col items-center justify-center p-6 font-manrope overflow-hidden text-center">

        <!-- Background Grid -->
        <div class="absolute inset-0 grid-bg opacity-40 pointer-events-none"></div>

        <!-- Axis & Glow -->
        <div
            class="absolute top-0 left-1/2 -translate-x-1/2 w-[1px] h-full bg-taurusGold/20 blur-[1px] pointer-events-none">
        </div>
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-red-600/20 rounded-full blur-[120px] glow-fx pointer-events-none">
        </div>

        <!-- Main UI Body -->
        <div class="relative z-10 w-full max-w-lg no-jitter flex flex-col items-center pt-8">

            <!-- LOGO SECTION -->
            <div class="relative w-36 h-36 md:w-44 md:h-44 mb-10 flex items-center justify-center">
                <div
                    class="absolute inset-0 rounded-full border-4 border-taurusGold/50 signal-wave pointer-events-none">
                </div>
                <div
                    class="absolute inset-0 rounded-full border-2 border-taurusGold/30 signal-wave-delay pointer-events-none">
                </div>

                <div
                    class="w-full h-full rounded-full bg-black border-2 border-taurusGold/60 flex items-center justify-center shadow-[0_0_70px_rgba(255,215,0,0.4)] relative z-20 overflow-hidden">
                    <img src="assets/favicon_taurus.png" alt="Taurus" class="w-[75%] h-[75%] object-contain" />
                </div>
            </div>

            <!-- Title -->
            <div class="mb-10 no-jitter">
                <h1
                    class="font-display text-2xl md:text-3xl font-black text-white uppercase tracking-[0.4em] leading-tight">
                    <span class="text-taurusGold">ACCESS</span> <br>
                    <span class="text-red-500 mt-2 block drop-shadow-[0_0_25px_rgba(239,68,68,0.7)]">SUSPENDED</span>
                </h1>
            </div>

            <!-- REDESIGNED INFO BLOCK - Cleaner, Technical Grid Styling -->
            <div
                class="relative w-full max-w-sm px-8 py-10 rounded-[2.5rem] bg-neutral-900/40 border border-white/10 backdrop-blur-3xl shadow-2xl no-jitter">
                <div
                    class="text-gray-400 text-[10px] md:text-xs leading-relaxed tracking-[0.2em] uppercase mb-10 opacity-80 border-b border-white/5 pb-6">
                    Platform Security has flagged this connection. <br>
                    Access Revoked to Maintain System Integrity.
                </div>

                <!-- Structured Technical Data Grid -->
                <div class="grid grid-cols-2 gap-y-6 text-left max-w-[280px] mx-auto">
                    <div class="space-y-1">
                        <p class="text-[7px] text-taurusGold/60 uppercase tracking-[0.3em]">Network Address</p>
                        <p class="text-[10px] md:text-xs font-mono text-white tracking-widest font-bold">192.168.1.1</p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-[7px] text-taurusGold/60 uppercase tracking-[0.3em]">Geo-Location</p>
                        <p class="text-[10px] md:text-xs font-mono text-white tracking-widest font-bold">Istanbul, TR
                        </p>
                    </div>
                    <div class="space-y-1 col-span-2">
                        <p class="text-[7px] text-taurusGold/60 uppercase tracking-[0.3em]">Session Identifier</p>
                        <p class="text-[10px] md:text-xs font-mono text-white tracking-widest font-bold">
                            SESS_TECHNICAL_CLEAN_V1</p>
                    </div>
                </div>
            </div>

            <!-- Adjusted Footer -->
            <div class="mt-8 flex flex-col items-center">
                <div class="w-[1px] h-6 bg-gradient-to-b from-taurusGold to-transparent opacity-40 mb-2"></div>
                <p class="text-[9px] text-taurusGold/50 font-bold uppercase tracking-[0.6em] animate-pulse">RESTRICTED
                    ACCESS MODE</p>
            </div>
        </div>
    </div>

</body>

</html>
