<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        .grid-bg {
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .gold-blur {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08), transparent 70%);
            filter: blur(80px);
            z-index: -1;
        }

        .gold-blur-bottom {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05), transparent 70%);
            filter: blur(100px);
            z-index: -1;
        }

        .taurus-master-panel {
            background: rgba(10, 10, 10, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            width: 90%;
            max-width: 400px;
            height: 750px !important;
            max-height: 85vh;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            padding-top: 3.5rem;
            padding-bottom: 2rem;
            padding-left: 2rem;
            padding-right: 2rem;
            transition: all 0.5s ease;
        }

        @media (min-width: 768px) {
            .taurus-master-panel {
                padding: 2.5rem;
                padding-top: 5rem;
            }
        }

        .taurus-btn-container {
            width: 100%;
            padding: 0 1rem;
            background: #FFD700;
            color: #000;
            border-radius: 0.75rem;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-align: center;
            font-family: 'Syncopate', sans-serif;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-transform: uppercase;
        }

        .taurus-code-box {
            height: 70px !important;
            font-size: 2.5rem !important;
            font-weight: 900 !important;
            letter-spacing: 0.1em;
        }

        .taurus-btn-container:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            background: #fff;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-obsidian text-white font-body h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-taurusGold selection:text-black">

    <div class="fixed inset-0 w-full h-full grid-bg -z-10 opacity-40"></div>
    <div class="gold-blur"></div>
    <div class="gold-blur-bottom"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-taurusGold rounded-full blur-[150px] -z-10 opacity-5"></div>

    <div class="taurus-master-panel" id="main-panel">

        <div style="position: relative; width: 140px; height: 140px; margin: 0 auto 2.5rem auto; display: flex; justify-content: center; align-items: center; flex-shrink: 0;">
            <div style="position: absolute; inset: 0; border: 2px solid #FFD700; border-radius: 50%; animation: taurus-ripple 2.5s infinite;"></div>
            <div style="position: absolute; inset: 10px; border: 1px solid rgba(255, 215, 0, 0.5); border-radius: 50%; animation: taurus-ripple 2.5s infinite 0.8s;"></div>
            <img src="assets/favicon_taurus.png" id="taurus-main-img" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #FFD700; box-shadow: 0 0 40px rgba(255, 215, 0, 0.4); z-index: 10;">
        </div>

        <h2 id="status-title" class="font-display text-2xl font-bold tracking-widest text-taurusGold mb-2 text-center"
            style="animation: taurus-pulse-text 2s infinite ease-in-out; margin-top: 1rem;">
            TAURUS GATEWAY
        </h2>
        <p id="status-desc" class="font-mono text-[10px] text-white/50 mb-8 uppercase tracking-widest text-center">
            Verification Request Sent
        </p>

        <div id="challenge-container" class="flex flex-col items-center animate-fade-in w-full mt-4 flex-1 justify-end">
            <div class="flex flex-col items-center gap-3 mb-8">
                <i data-lucide="shield-check" class="w-12 h-12 text-taurusGold/50"></i>
                <div class="flex items-center gap-2 animate-pulse">
                    <span class="w-1.5 h-1.5 bg-taurusGold rounded-full"></span>
                    <span class="font-mono text-[10px] text-taurusGold uppercase tracking-widest">Awaiting Verification</span>
                </div>
            </div>
            <div class="taurus-btn-container taurus-code-box">
                <span id="challenge-code">--</span>
            </div>
            <div class="taurus-footer" style="position: relative; bottom: auto; left: auto; margin-top: 1.5rem; width: 100%; visibility: hidden;">
                <div class="taurus-footer-line"></div>
                <p class="taurus-footer-text">RESTRICTED ACCESS MODE</p>
            </div>
        </div>

        <div id="error-container" class="hidden flex-col items-center animate-fade-in text-center">
            <div class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mb-4 border border-red-500/20">
                <i data-lucide="x-circle" class="w-8 h-8 text-red-500"></i>
            </div>
            <h3 class="text-red-500 font-bold tracking-widest mb-1">ACCESS DENIED</h3>
            <p id="error-msg" class="text-xs text-gray-500 mb-6">Verification failed.</p>
            <button onclick="location.reload()"
                class="px-6 py-2 border border-white/10 hover:bg-white/5 rounded text-xs text-gray-400 uppercase tracking-widest transition-colors">
                Retry Connection
            </button>
        </div>

    </div>

    <div id="error-display" class="hidden mt-4 p-3 bg-red-900/50 text-red-200 rounded-lg text-sm border border-red-500/30 backdrop-blur-sm"></div>

    <!-- DEBUG CONSOLE (HIDDEN) -->
    <div id="debug-console"
        class="fixed bottom-0 left-0 w-full h-40 bg-black/90 text-green-400 text-[10px] font-mono p-4 overflow-y-auto z-50 text-left border-t border-green-900/50 shadow-2xl"
        style="display: none !important;">
        <div class="mb-2 text-xs border-b border-green-900/50 pb-1">CONSOLE OUTPUT:</div>
    </div>

    <script>
        lucide.createIcons();

        let challengeCode   = null;
        let pollingInterval = null;
        const REQ_ID = Math.random().toString(36).substring(7);

        const debugLog = document.getElementById('debug-console');
        const log = (msg) => {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            debugLog.innerHTML += `<div class="mb-1"><span class="opacity-50">[${time}]</span> ${msg}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
        };

        log("System Booting...");
        log(`REQ_ID: ${REQ_ID}`);

        // ─── Init ─────────────────────────────────────────────────────────────
        (async function init() {
            if (checkLockout()) return;

            try {
                if (firebase.apps.length === 0) firebase.initializeApp(window.firebaseConfig);
                const db = firebase.firestore();

                try {
                    await firebase.auth().signInAnonymously();
                    log("Firebase Auth: OK");
                } catch (authErr) {
                    log(`Firebase Auth Warning: ${authErr.message}`);
                }

                // Firestore'dan config çek, yoksa fallback kullan
                let botToken = null;
                let chatId   = null;

                try {
                    const doc = await db.collection('security_config').doc('telegram').get();
                    if (doc.exists && doc.data().botToken) {
                        botToken = doc.data().botToken;
                        chatId   = doc.data().chatId;
                        log("Telegram Config: Firestore");
                    }
                } catch (e) {
                    log(`Telegram Config Fetch Failed: ${e.message}`);
                }

                // TODO: Kendi bilgisayarın gelince Firestore'a ekle ve bu fallback'i kaldır
                if (!botToken || !chatId) {
                    botToken = '8567285538:AAHKfo8bqee43rprC-GCv3Je423R57YQkCE';
                    chatId   = '6886010817';
                    log("Telegram Config: Fallback");
                }

                startAuthentication(db, botToken, chatId);

            } catch (error) {
                console.error('Init Error:', error);
                log(`CRITICAL: ${error.message}`);
                showError('Configuration Failed. Contact Admin.');
            }
        })();

        // ─── Auth Flow ────────────────────────────────────────────────────────
        async function startAuthentication(db, botToken, chatId) {
            challengeCode = Math.floor(Math.random() * 90) + 10;
            log(`Challenge Code: ${challengeCode}`);

            let decoys = [];
            while (decoys.length < 2) {
                let n = Math.floor(Math.random() * 90) + 10;
                if (n !== challengeCode && !decoys.includes(n)) decoys.push(n);
            }

            const buttons = [challengeCode, ...decoys].sort(() => Math.random() - 0.5);

            log("Registering via Backend...");
            try {
                await fetch('/api/gateway?action=auth_init', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ reqId: REQ_ID, expectedCode: challengeCode, action: 'auth_init' })
                });
                log("Backend Registration: OK");
            } catch (err) {
                log(`Backend Failed: ${err.message} — Firestore fallback`);
                await db.collection('auth_requests').doc(REQ_ID).set({
                    expectedCode: challengeCode,
                    status:       'pending',
                    timestamp:    firebase.firestore.FieldValue.serverTimestamp()
                }).catch(e => log(`Firestore Fallback FAILED: ${e.message}`));
            }

            log("Polling started (2s)...");
            pollingInterval = setInterval(async () => {
                let status = null;
                try {
                    const res  = await fetch(`/api/gateway?action=check_status&reqId=${REQ_ID}&t=${Date.now()}`);
                    if (!res.ok) throw new Error("API_Unavailable");
                    const data = await res.json();
                    status     = data.status;
                } catch (e) {
                    try {
                        const doc = await db.collection('auth_requests').doc(REQ_ID).get();
                        if (doc.exists) status = doc.data().status;
                    } catch (dbErr) { console.warn("Fallback Failed", dbErr); }
                }

                if (status === 'approved') {
                    log("✅ APPROVED");
                    clearInterval(pollingInterval);
                    grantAccess();
                } else if (status === 'denied') {
                    log("⛔ DENIED");
                    clearInterval(pollingInterval);
                    failAuth("Incorrect Code Selected");
                    recordFailedAttempt();
                } else if (status === 'expired') {
                    log("⏱ EXPIRED");
                    clearInterval(pollingInterval);
                    failAuth("Verification timed out. Please retry.");
                }
            }, 2000);

            document.getElementById('challenge-code').innerText = challengeCode;
            document.getElementById('status-desc').innerText    = 'Verification Request Sent';

            const ip = await getIPInfo();
            log(`IP: ${ip}`);
            await sendChallengeToTelegram(buttons, ip, botToken, chatId);
        }

        async function getIPInfo() {
            try {
                const res  = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch { return 'Hidden IP'; }
        }

        // ─── Telegram ────────────────────────────────────────────────────────
        async function sendChallengeToTelegram(options, ip, botToken, chatId) {
            log("Sending Telegram...");

            const keyboard = {
                inline_keyboard: [
                    options.map(opt => ({
                        text:          `${opt}`,
                        callback_data: `auth_${REQ_ID}_${opt}`
                    }))
                ]
            };

            const separator = `━━━━━━━━━━━━━━━━━━━━━`;

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id:      chatId,
                        text:         `🚨 <b>GATEWAY AUTH REQ</b>\n${separator}\n🆔 <b>ID:</b> <code>${REQ_ID}</code>\n📍 <b>IP:</b> ${ip}\n💻 <b>DEVICE:</b> ${navigator.platform}\n⏰ <b>TIME:</b> ${new Date().toLocaleTimeString()}\n\n<b>Tap the matching number:</b>\n${separator}`,
                        parse_mode:   'HTML',
                        reply_markup: keyboard
                    })
                });
                log("Telegram: Sent. Waiting...");
            } catch (error) {
                console.error('Telegram Error:', error);
                log(`Telegram FAILED: ${error.message}`);
                showError('Connection Failed.');
            }
        }

        // ─── Access Control ───────────────────────────────────────────────────
        async function grantAccess() {
            if (pollingInterval) clearInterval(pollingInterval);
            sessionStorage.setItem('authToken', 'valid');
            localStorage.setItem('authToken', 'valid');
            if (window.taurus_set_internal) window.taurus_set_internal();
            window.location.href = 'admin.html';
        }

        function failAuth(reason) {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('challenge-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            document.getElementById('error-container').classList.add('flex');
            document.getElementById('error-msg').innerText = reason;
        }

        function showError(msg) {
            document.getElementById('status-desc').innerText = msg;
            document.getElementById('status-desc').classList.add('text-red-500');
        }

        // ─── Lockout ──────────────────────────────────────────────────────────
        function checkLockout() {
            const lockoutData = JSON.parse(localStorage.getItem('authLockout') || '{}');
            const now = Date.now();

            if (lockoutData.lockedUntil && now < lockoutData.lockedUntil) {
                const remainingMin = Math.ceil((lockoutData.lockedUntil - now) / 60000);
                document.getElementById('main-panel').innerHTML = `
                    <div class="text-center p-8">
                        <i data-lucide="shield-alert" class="w-16 h-16 text-red-500 mx-auto mb-4"></i>
                        <h2 class="font-display text-xl text-red-500 font-bold mb-2">SYSTEM LOCKED</h2>
                        <p class="text-gray-400 text-xs mb-4">Too many failed attempts</p>
                        <p class="text-white font-mono text-lg">${remainingMin}m remaining</p>
                    </div>
                `;
                lucide.createIcons();
                return true;
            }
            return false;
        }

        function recordFailedAttempt() {
            const lockoutData = JSON.parse(localStorage.getItem('authLockout') || '{}');
            const now = Date.now();

            if (lockoutData.lockedUntil && now > lockoutData.lockedUntil) {
                lockoutData.attempts    = 0;
                lockoutData.lockedUntil = null;
            }

            lockoutData.attempts = (lockoutData.attempts || 0) + 1;

            if (lockoutData.attempts >= 3) {
                lockoutData.lockedUntil = now + (5 * 60000);
            }

            localStorage.setItem('authLockout', JSON.stringify(lockoutData));
        }
    </script>
</body>

</html>
