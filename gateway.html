<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gateway | Ömer YİĞİTLER</title>
    <link rel="icon" href="assets/favicon_taurus.png" type="image/png">
    <script src="assets/js/system-modals.js?v=V7"></script>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-516666531"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-516666531');
    </script>

    <link href="assets/css/styles.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>

    <style>
        .grid-bg {
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        @keyframes pulse-slow {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }

        .animate-pulse-slow {
            animation: pulse-slow 3s ease-in-out infinite;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body
    class="bg-obsidian text-white font-body h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-taurusGold selection:text-black">

    <div class="fixed inset-0 w-full h-full grid-bg -z-10 opacity-40"></div>
    <div
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-taurusGold rounded-full blur-[150px] -z-10 opacity-5">
    </div>

    <div class="crystal-panel p-8 md:p-12 rounded-3xl w-full max-w-md text-center transform transition-all duration-500 scale-100 opacity-100 relative"
        id="main-panel">

        <div class="mb-8 relative">
            <div class="absolute -inset-4 bg-taurusGold/20 rounded-full blur-xl animate-pulse"></div>
            <i data-lucide="shield-check" class="w-16 h-16 text-taurusGold relative z-10 mx-auto"></i>
        </div>

        <!-- Status Text -->
        <h2 id="status-title" class="font-display text-2xl font-bold tracking-widest text-white mb-2 text-center">
            SECURE SESSION
        </h2>
        <p id="status-desc" class="font-mono text-xs text-taurusGold/60 mb-8 uppercase tracking-widest text-center">
            Establishing uplink...
        </p>

        <!-- 2FA Challenge Display -->
        <div id="challenge-container" class="hidden flex-col items-center animate-fade-in">
            <div class="relative group mb-6">
                <div
                    class="absolute -inset-6 bg-taurusGold/10 rounded-full blur-2xl group-hover:bg-taurusGold/20 transition-all duration-500">
                </div>
                <div
                    class="relative w-32 h-32 flex items-center justify-center border-2 border-taurusGold/30 bg-black/40 backdrop-blur-xl rounded-2xl">
                    <span id="challenge-code"
                        class="font-display text-6xl font-bold text-white tracking-tighter">--</span>
                </div>
            </div>

            <div class="flex items-center gap-3 animate-pulse mb-4">
                <span class="w-2 h-2 bg-taurusGold rounded-full"></span>
                <span class="font-mono text-[10px] text-taurusGold uppercase tracking-widest">Awaiting
                    Verification</span>
            </div>
            <p class="text-xs text-gray-500 text-center max-w-[240px] leading-relaxed">
                Check your Telegram.<br>Tap the matching number to unlock.
            </p>
        </div>

        <!-- Error/Lockout Display -->
        <div id="error-container" class="hidden flex-col items-center animate-fade-in text-center">
            <div
                class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mb-4 border border-red-500/20">
                <i data-lucide="x-circle" class="w-8 h-8 text-red-500"></i>
            </div>
            <h3 class="text-red-500 font-bold tracking-widest mb-1">ACCESS DENIED</h3>
            <p id="error-msg" class="text-xs text-gray-500 mb-6">Verification failed.</p>
            <button onclick="location.reload()"
                class="px-6 py-2 border border-white/10 hover:bg-white/5 rounded text-xs text-gray-400 uppercase tracking-widest transition-colors">
                Retry Connection
            </button>
        </div>

    </div>

    <!-- Redirect Message (Hidden by default) -->
    <div id="success-msg"
        class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none">
        <h2 class="font-display text-4xl text-taurusGold font-bold mb-4 animate-bounce">Access Granted</h2>
        <p class="text-gray-400 text-sm tracking-widest">Initiating Admin Protocol...</p>
    </div>

    <script>
        lucide.createIcons();

        // --- TELEGRAM 2FA LOGIC ---
        let botToken = null;
        let chatId = null;
        let challengeCode = null;
        let pollingInterval = null;
        let lastUpdateId = 0;
        let attempts = 0;
        let currentMessageId = null;

        // 1. Initialize & Load Config
        (async function init() {
            if (checkLockout()) return;

            try {
                if (firebase.apps.length === 0) firebase.initializeApp(window.firebaseConfig);
                const db = firebase.firestore();

                // AUTHENTICATE FIRST (Required for Firestore Access)
                try {
                    await firebase.auth().signInAnonymously();
                } catch (authErr) {
                    console.warn('Authentication warning:', authErr);
                }

                // Get Telegram Config (With Try-Catch for robustness)
                try {
                    const doc = await db.collection('security_config').doc('telegram').get();
                    if (doc.exists) {
                        botToken = doc.data().botToken;
                        chatId = doc.data().chatId;
                        console.log('✅ Config loaded from Firebase');
                    }
                } catch (dbErr) {
                    console.warn('Config fetch failed (likely permission/missing doc), switching to fallback:', dbErr);
                }

                // FALLBACK CREDENTIALS (Auto-Recovery)
                if (!botToken || !chatId) {
                    console.log('⚠️ Using fallback credentials');
                    botToken = '8567285538:AAHKfo8bqee43rprC-GCv3Je423R57YQkCE';
                    chatId = '6886010817';
                }

                if (!botToken || !chatId) {
                    throw new Error('Telegram configuration missing and no fallback available');
                }

                startAuthentication();

            } catch (error) {
                console.error('Init Error:', error);
                showError('Configuration Failed. Contact Admin.');
            }
        })();

        // 2. Start Auth Process
        async function startAuthentication() {
            // Generate Challenge (10-99)
            challengeCode = Math.floor(Math.random() * 90) + 10;

            // Generate Decoys
            let decoys = [];
            while (decoys.length < 2) {
                let n = Math.floor(Math.random() * 90) + 10;
                if (n !== challengeCode && !decoys.includes(n)) decoys.push(n);
            }

            // Shuffle buttons
            let buttons = [challengeCode, ...decoys].sort(() => Math.random() - 0.5);

            // UI Update
            document.getElementById('challenge-container').classList.remove('hidden');
            document.getElementById('challenge-container').classList.add('flex');
            document.getElementById('challenge-code').innerText = challengeCode;
            document.getElementById('status-desc').innerText = 'Verification Request Sent';

            // Send to Telegram
            const ipInfo = await getIPInfo();
            const msgData = await sendChallengeToTelegram(buttons, ipInfo);
            if (msgData && msgData.ok) currentMessageId = msgData.result.message_id;

            // Start Polling
            startPolling();
        }

        async function getIPInfo() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch { return 'Hidden IP'; }
        }

        // 3. Send Telegram Message
        async function sendChallengeToTelegram(options, ip) {
            console.log('📤 Sending Telegram Request...');
            console.log('Bot Token Prefix:', botToken ? botToken.substring(0, 10) + '...' : 'NULL');
            console.log('Chat ID:', chatId);

            const keyboard = {
                inline_keyboard: [
                    options.map(opt => ({
                        text: `🔒 ${opt}`,
                        callback_data: opt.toString()
                    }))
                ]
            };

            const device = navigator.platform;
            const time = new Date().toLocaleTimeString();

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: `🚨 <b>GATEWAY ACCESS REQUEST</b>\n\n📍 IP: ${ip}\n💻 Device: ${device}\n⏰ Time: ${time}\n\n<b>Tap the matching number:</b>`,
                        parse_mode: 'HTML',
                        reply_markup: keyboard
                    })
                });

                const data = await response.json();
                console.log('📨 Telegram API Response:', data);

                if (data.ok) return data;

                if (!data.ok) {
                    console.error('❌ Telegram API Error:', data.description);
                    showError(`Telegram Error: ${data.description}`);
                }
            } catch (error) {
                console.error('❌ Network/Fetch Error:', error);
                showError('Connection Failed. Check Console.');
            }
        }

        // 4. Poll for Updates
        function startPolling() {
            console.log("🚀 POLLING STARTED. currentMessageId:", currentMessageId);
            
            pollingInterval = setInterval(async () => {
                if (attempts > 120) { 
                    failAuth("Request Timed Out");
                    return;
                }
                attempts++;

                try {
                    const params = lastUpdateId ? `?offset=${lastUpdateId + 1}&limit=10&timeout=0` : `?limit=10&timeout=0`;
                    const res = await fetch(`https://api.telegram.org/bot${botToken}/getUpdates${params}`);
                    const data = await res.json();

                    if (data.ok && data.result.length > 0) {
                        for (const update of data.result) {
                            if (update.update_id > lastUpdateId) lastUpdateId = update.update_id;

                            if (update.callback_query) {
                                console.log("🔍 CALLBACK RECEIVED:", update.callback_query);
                                const msgId = update.callback_query.message ? update.callback_query.message.message_id : null;
                                
                                // Debug Log
                                console.log("Checking MsgID:", msgId, "vs Expected:", currentMessageId);

                                if (currentMessageId && msgId && msgId !== currentMessageId) {
                                    console.warn("⚠️ Ignored stale click from msg:", msgId);
                                    continue;
                                }

                                const answer = update.callback_query.data;
                                const isMatch = parseInt(answer) == challengeCode;
                                console.log("🔐 Comparison:", answer, "==", challengeCode, "->", isMatch);

                                fetch(`https://api.telegram.org/bot${botToken}/answerCallbackQuery`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        callback_query_id: update.callback_query.id,
                                        text: isMatch ? "Redirecting..." : "Access Denied ⛔"
                                    })
                                }).catch(e => console.error(e));

                                if (isMatch) {
                                    console.log("✅ ACCESS GRANTED. Calling grantAccess()...");
                                    grantAccess();
                                    return;
                                } else {
                                    console.log("⛔ FAIL AUTH triggering...");
                                    failAuth("Incorrect Code Selected");
                                    recordFailedAttempt();
                                    return;
                                }
                            }
                        }
                    }
                } catch (e) { console.error("Poll Error:", e); }
            }, 1000);
        }

        function grantAccess() {
            clearInterval(pollingInterval);
            document.getElementById('status-title').innerText = "ACCESS GRANTED";
            document.getElementById('status-title').classList.add('text-green-500');
            document.getElementById('challenge-container').classList.add('hidden');

            // Delete lock message from telegram to prevent reuse (optional)

            setTimeout(() => {
                sessionStorage.setItem('authToken', 'valid');
                window.location.href = 'admin.html';
            }, 1000);
        }

        function failAuth(reason) {
            clearInterval(pollingInterval);
            document.getElementById('challenge-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            document.getElementById('error-container').classList.add('flex');
            document.getElementById('error-msg').innerText = reason;
        }

        function showError(msg) {
            document.getElementById('status-desc').innerText = msg;
            document.getElementById('status-desc').classList.add('text-red-500');
        }

        // --- LOCKOUT LOGIC ---
        function checkLockout() {
            const lockoutData = JSON.parse(localStorage.getItem('patternLockout') || '{}');
            const now = Date.now();

            if (lockoutData.lockedUntil && now < lockoutData.lockedUntil) {
                const remainingMin = Math.ceil((lockoutData.lockedUntil - now) / 60000);
                document.getElementById('main-panel').innerHTML = `
                    <div class="text-center p-8">
                        <i data-lucide="shield-alert" class="w-16 h-16 text-red-500 mx-auto mb-4"></i>
                        <h2 class="font-display text-xl text-red-500 font-bold mb-2">SYSTEM LOCKED</h2>
                        <p class="text-gray-400 text-xs mb-4">Too many failed attempts</p>
                        <p class="text-white font-mono text-lg">${remainingMin}m remaining</p>
                    </div>
                `;
                lucide.createIcons();
                return true;
            }
            return false;
        }

        function recordFailedAttempt() {
            const lockoutData = JSON.parse(localStorage.getItem('patternLockout') || '{}');
            const now = Date.now();

            // Reset if expired
            if (lockoutData.lockedUntil && now > lockoutData.lockedUntil) {
                lockoutData.attempts = 0;
                lockoutData.lockedUntil = null;
            }

            lockoutData.attempts = (lockoutData.attempts || 0) + 1;

            if (lockoutData.attempts >= 3) {
                lockoutData.lockedUntil = now + (5 * 60000); // 5 mins
            }

            localStorage.setItem('patternLockout', JSON.stringify(lockoutData));
        }

    </script>
</body>

</html>
