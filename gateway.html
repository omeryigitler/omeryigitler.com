<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Gateway | Ömer YİĞİTLER</title>
    <link rel="icon" href="assets/favicon_taurus.png" type="image/png">
    <script src="assets/js/system-modals.js?v=V9"></script>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-516666531"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-516666531');

    <link href="assets/css/styles.css?v=V9" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/tracker/taurus-tracker-v5.js?v=V9"></script>

    <style>
        .grid-bg {
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body
    class="bg-obsidian text-white font-body h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-taurusGold selection:text-black">

    <div class="fixed inset-0 w-full h-full grid-bg -z-10 opacity-20"></div>

    <div class="crystal-panel p-8 md:p-12 rounded-3xl w-full max-w-md text-center transform transition-all duration-500 scale-100 opacity-100 relative"
        id="main-panel">

        <p id="status-desc" class="font-mono text-[10px] text-taurusGold mb-8 uppercase tracking-widest text-center">
            Initializing...
        </p>

        <div id="challenge-container" class="hidden flex-col items-center animate-fade-in">
            <div class="relative mb-6">
                <div
                    class="relative w-32 h-32 flex items-center justify-center border-2 border-taurusGold/30 bg-black/40 backdrop-blur-xl rounded-2xl">
                    <span id="challenge-code"
                        class="font-display text-6xl font-bold text-white tracking-tighter">--</span>
                </div>
            </div>
        </div>

        <!-- Error/Lockout Display -->
        <div id="error-container" class="hidden flex-col items-center animate-fade-in text-center">
            <div
                class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mb-4 border border-red-500/20">
                <i data-lucide="x-circle" class="w-8 h-8 text-red-500"></i>
            </div>
            <h3 class="text-red-500 font-bold tracking-widest mb-1">ACCESS DENIED</h3>
            <p id="error-msg" class="text-xs text-gray-500 mb-6">Verification failed.</p>
            <button onclick="location.reload()"
                class="px-6 py-2 border border-white/10 hover:bg-white/5 rounded text-xs text-gray-400 uppercase tracking-widest transition-colors">
                Retry Connection
            </button>
        </div>

    </div>

    <!-- Redirect Message (Hidden by default) -->
    <div id="success-msg"
        class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none">
        <h2 class="font-display text-4xl text-taurusGold font-bold mb-4 animate-bounce">Access Granted</h2>
        <p class="text-gray-400 text-sm tracking-widest">Initiating Admin Protocol...</p>
    </div>

    <div id="error-display"
        class="hidden mt-4 p-3 bg-red-900/50 text-red-200 rounded-lg text-sm border border-red-500/30 backdrop-blur-sm">
    </div>

    <!-- DEBUG CONSOLE (HIDDEN AS REQUESTED) -->
    <div id="debug-console"
        class="fixed bottom-0 left-0 w-full h-40 bg-black/90 text-green-400 text-[10px] font-mono p-4 overflow-y-auto z-50 text-left border-t border-green-900/50 shadow-2xl"
        style="display: none !important;">
        <div class="mb-2 text-xs border-b border-green-900/50 pb-1">CONSOLE OUTPUT (Screenshot this if stuck):</div>
    </div>

    <script>
        lucide.createIcons();

        // --- UNIFIED WEBHOOK ARCHITECTURE (No Polling) ---
        let botToken = null;
        let chatId = null;
        let challengeCode = null;
        let authListener = null;
        const REQ_ID = Math.random().toString(36).substring(7); // Unique Request ID needed for Webhook
        let pollingInterval = null; // Defined explicitly

        const debugLog = document.getElementById('debug-console');
        const log = (msg) => {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            debugLog.innerHTML += `<div class="mb-1"><span class="opacity-50">[${time}]</span> ${msg}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
        };

        log("System Booting...");
        log(`Generated REQ_ID: ${REQ_ID}`);


        // 1. Initialize & Load Config
        (async function init() {
            // BACKDOOR / BYPASS CHECK
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('unlock') === 'true') {
                console.log("🔓 Bypass Key Detected");
                grantAccess();
                return;
            }

            if (checkLockout()) return;

            try {
                if (firebase.apps.length === 0) firebase.initializeApp(window.firebaseConfig);
                const db = firebase.firestore();

                // AUTHENTICATE FIRST (Required for Firestore Access)
                try {
                    await firebase.auth().signInAnonymously();
                    log("Firebase Auth: Anonymous Sign-in Success");
                } catch (authErr) {
                    log(`Firebase Auth Warning: ${authErr.message}`);
                }

                // Get Telegram Config
                try {
                    const doc = await db.collection('security_config').doc('telegram').get();
                    if (doc.exists) {
                        botToken = doc.data().botToken;
                        chatId = doc.data().chatId;
                    }
                } catch (dbErr) { console.warn(dbErr); }

                if (!botToken || !chatId) {
                    // FALLBACK
                    botToken = '8567285538:AAHKfo8bqee43rprC-GCv3Je423R57YQkCE';
                    chatId = '6886010817';
                    log("Using Fallback Telegram Credentials");
                }

                startAuthentication(db);

            } catch (error) {
                console.error('Init Error:', error);
                log(`CRITICAL INIT ERROR: ${error.message}`);
                showError('Configuration Failed. Contact Admin.');
            }
        })();

        // 2. Start Auth Process (FIREBASE LISTENER MODE)
        async function startAuthentication(db) {
            // Generate Challenge (10-99)
            challengeCode = Math.floor(Math.random() * 90) + 10;
            log(`Challenge Code: ${challengeCode}`);

            // Generate Decoys
            let decoys = [];
            while (decoys.length < 2) {
                let n = Math.floor(Math.random() * 90) + 10;
                if (n !== challengeCode && !decoys.includes(n)) decoys.push(n);
            }

            // Shuffle buttons
            let buttons = [challengeCode, ...decoys].sort(() => Math.random() - 0.5);

            // Register Request via Backend (Bypasses Firestore Rules)
            log("Registering Request via Backend...");
            try {
                await fetch('/api/gateway?action=auth_init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reqId: REQ_ID, expectedCode: challengeCode, action: 'auth_init' })
                });
                log("Backend Registration: SUCCESS");
            } catch (err) {
                log(`Backend Registration FAILED: ${err.message}`);
                console.error("Backend Init Failed", err);
                // Fallback to client-side write (just in case)
                await db.collection('auth_requests').doc(REQ_ID).set({
                    expectedCode: challengeCode,
                    status: 'pending',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(e => log(`Client Fallback FAILED: ${e.message}`));
            }

            // LISTEN FOR APPROVAL (Polling Backend to Bypass Rules)
            log("Starting Status Polling Loop (2000ms)...");

            pollingInterval = setInterval(async () => {
                let status = null;
                try {
                    const url = `/api/gateway?action=check_status&reqId=${REQ_ID}&t=${Date.now()}`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("API_Unavailable");

                    const data = await res.json();
                    status = data.status;
                } catch (e) {
                    // LOCAL FALLBACK: Direct Firestore Read
                    // log(`API Fail (${e.message}). Using Firestore Fallback...`); 
                    try {
                        const doc = await db.collection('auth_requests').doc(REQ_ID).get();
                        if (doc.exists) status = doc.data().status;
                    } catch (dbErr) { console.warn("Fallback Failed", dbErr); }
                }

                if (status === 'approved') {
                    log("✅ STATUS: APPROVED. Unlocking...");
                    clearInterval(pollingInterval);
                    grantAccess();
                } else if (status === 'denied') {
                    log("⛔ STATUS: DENIED.");
                    clearInterval(pollingInterval);
                    failAuth("Incorrect Code Selected");
                    recordFailedAttempt();
                } else if (status === 'pending') {
                    // Waiting...
                } else {
                    // log(`Status: ${status}`);
                }
            }, 2000); // Check every 2 seconds

            // UI Update
            document.getElementById('challenge-container').classList.remove('hidden');
            document.getElementById('challenge-container').classList.add('flex');
            document.getElementById('challenge-code').innerText = challengeCode;
            document.getElementById('status-desc').innerText = 'Verification Request Sent';

            // Send to Telegram (With AUTH_REQID prefix)
            const ipInfo = await getIPInfo();
            log(`IP Detected: ${ipInfo}`);
            await sendChallengeToTelegram(buttons, ipInfo);
        }

        async function getIPInfo() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch { return 'Hidden IP'; }
        }

        // 3. Send Telegram Message
        async function sendChallengeToTelegram(options, ip) {
            console.log('📤 Sending Telegram Request...');
            log("Sending Telegram Buttons...");

            const keyboard = {
                inline_keyboard: [
                    options.map(opt => ({
                        text: `${opt}`,
                        callback_data: `auth_${REQ_ID}_${opt}` // UNIFIED FORMAT
                    }))
                ]
            };

            const device = navigator.platform;
            const time = new Date().toLocaleTimeString();

            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: `🚨 <b>GATEWAY AUTH REQ</b>\n\n🆔 ID: <code>${REQ_ID}</code>\n📍 IP: ${ip}\n💻 Device: ${device}\n⏰ Time: ${time}\n\n<b>Tap the matching number:</b>`,
                        parse_mode: 'HTML',
                        reply_markup: keyboard
                    })
                });
                log("Telegram Message Sent. Waiting for you...");
            } catch (error) {
                console.error('❌ Network/Fetch Error:', error);
                log(`Telegram Send FAILED: ${error.message}`);
                showError('Connection Failed. Check Console.');
            }
        }

        function grantAccess() {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('status-desc').innerText = "ACCESS GRANTED";
            document.getElementById('status-desc').classList.add('text-green-500');
            document.getElementById('challenge-container').classList.add('hidden');

            setTimeout(() => {
                sessionStorage.setItem('authToken', 'valid');
                localStorage.setItem('authToken', 'valid'); // Redundant backup
                if (window.taurus_set_internal) window.taurus_set_internal();
                window.location.href = 'admin.html';
            }, 1000);
        }

        function failAuth(reason) {
            if (pollingInterval) clearInterval(pollingInterval);
            document.getElementById('challenge-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            document.getElementById('error-container').classList.add('flex');
            document.getElementById('error-msg').innerText = reason;
        }

        function showError(msg) {
            document.getElementById('status-desc').innerText = msg;
            document.getElementById('status-desc').classList.add('text-red-500');
        }

        // --- LOCKOUT LOGIC ---
        function checkLockout() {
            const lockoutData = JSON.parse(localStorage.getItem('patternLockout') || '{}');
            const now = Date.now();

            if (lockoutData.lockedUntil && now < lockoutData.lockedUntil) {
                const remainingMin = Math.ceil((lockoutData.lockedUntil - now) / 60000);
                document.getElementById('main-panel').innerHTML = `
                    <div class="text-center p-8">
                        <i data-lucide="shield-alert" class="w-16 h-16 text-red-500 mx-auto mb-4"></i>
                        <h2 class="font-display text-xl text-red-500 font-bold mb-2">SYSTEM LOCKED</h2>
                        <p class="text-gray-400 text-xs mb-4">Too many failed attempts</p>
                        <p class="text-white font-mono text-lg">${remainingMin}m remaining</p>
                    </div>
                `;
                lucide.createIcons();
                return true;
            }
            return false;
        }

        function recordFailedAttempt() {
            const lockoutData = JSON.parse(localStorage.getItem('patternLockout') || '{}');
            const now = Date.now();

            // Reset if expired
            if (lockoutData.lockedUntil && now > lockoutData.lockedUntil) {
                lockoutData.attempts = 0;
                lockoutData.lockedUntil = null;
            }

            lockoutData.attempts = (lockoutData.attempts || 0) + 1;

            if (lockoutData.attempts >= 3) {
                lockoutData.lockedUntil = now + (5 * 60000); // 5 mins
            }

            localStorage.setItem('patternLockout', JSON.stringify(lockoutData));
        }

    </script>
</body>

</html>
