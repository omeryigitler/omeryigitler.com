<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAURUS | Gateway</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="./assets/js/firebase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glitch-text {
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0% {
                text-shadow: 2px 0 red, -2px 0 blue;
            }

            2% {
                text-shadow: -2px 0 red, 2px 0 blue;
            }

            4% {
                text-shadow: 0 0 0;
            }
        }

        .scanning-line {
            height: 2px;
            width: 100%;
            background: rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 10px #0f0;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(400px);
            }
        }
    </style>
</head>

<body class="bg-black text-green-500 font-mono flex items-center justify-center h-screen overflow-hidden relative">

    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
        <div class="scanning-line absolute top-0"></div>
    </div>

    <!-- MAIN CONTAINER -->
    <div
        class="z-10 bg-black/80 p-8 border border-green-500/30 rounded-lg shadow-[0_0_30px_rgba(0,255,0,0.2)] max-w-md w-full text-center">

        <div class="mb-6">
            <i data-lucide="shield-alert" class="w-16 h-16 mx-auto mb-4 text-green-500 animate-pulse"></i>
            <h1 class="text-2xl font-bold tracking-[0.2em] glitch-text">SECURE GATEWAY</h1>
            <p class="text-xs text-gray-400 mt-2">BIOMETRIC AUTHENTICATION REQUIRED</p>
        </div>

        <!-- STATUS DISPLAY -->
        <div id="status-container" class="mb-8 p-4 border border-green-500/20 bg-green-500/5 rounded">
            <div class="text-xs uppercase tracking-widest text-gray-500 mb-1">Status</div>
            <div id="status-title" class="text-lg font-bold animate-pulse text-yellow-500">AWAITING BIOMETRICS</div>
        </div>

        <!-- CHALLENGE UI -->
        <div id="challenge-container">
            <p class="text-sm mb-4">CONFIRM IDENTITY VIA SECURE CHANNEL</p>

            <div class="flex justify-center gap-4 mb-6" id="numbers-display">
                <!-- Numbers will be injected here -->
                <div
                    class="w-12 h-12 flex items-center justify-center border border-green-500/50 rounded bg-green-500/10 text-xl font-bold animate-bounce hidden">
                    ?</div>
            </div>

            <div class="text-xs text-gray-500">
                <p>1. Check Telegram</p>
                <p>2. Select Code: <span id="code-display" class="text-white font-bold text-lg mx-1">--</span></p>
            </div>
        </div>

        <!-- ERROR UI -->
        <div id="error-container" class="hidden">
            <div class="text-red-500 font-bold text-xl mb-4">ACCESS DENIED</div>
            <p class="text-xs text-gray-400 mb-4">Biometric signature mismatch.</p>
            <button onclick="window.location.reload()"
                class="px-6 py-2 border border-red-500 text-red-500 hover:bg-red-500 hover:text-white transition-colors uppercase text-xs font-bold tracking-widest">Retry</button>
        </div>

    </div>

    <div class="absolute bottom-4 text-[10px] text-gray-600">
        TAURUS SECURITY SYSTEMS v4.2.0 | ENCRYPTED CONNECTION
    </div>

    <script>
        lucide.createIcons();

        let botToken = null;
        let chatId = null;
        let challengeCode = null;
        const REQ_ID = Math.random().toString(36).substring(7); // Unique Request ID

        // FORCE UNLOCK (Backdoor)
        if (new URLSearchParams(window.location.search).get('unlock') === 'true') {
            grantAccess();
        }

        // 1. Initialize logic
        (async function init() {
            if (checkLockout()) return;

            try {
                // Initial Auth for Firestore
                if (firebase.apps.length === 0) firebase.initializeApp(window.firebaseConfig);
                await firebase.auth().signInAnonymously().catch(e => console.warn("Auth Warn:", e));

                const db = firebase.firestore();

                // Get Config
                try {
                    const doc = await db.collection('security_config').doc('telegram').get();
                    if (doc.exists) {
                        botToken = doc.data().botToken;
                        chatId = doc.data().chatId;
                    }
                } catch (e) { console.warn("Config fetch failed:", e); }

                // Fallback
                if (!botToken || !chatId) {
                    botToken = '8567285538:AAHKfo8bqee43rprC-GCv3Je423R57YQkCE';
                    chatId = '6886010817';
                }

                // Setup Challenge
                challengeCode = Math.floor(Math.random() * 90) + 10;
                document.getElementById('code-display').innerText = challengeCode; // Show user

                // Register Request in Firestore (Stateful)
                await db.collection('auth_requests').doc(REQ_ID).set({
                    expectedCode: challengeCode,
                    status: 'pending',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Listen for Result (No Polling!)
                db.collection('auth_requests').doc(REQ_ID).onSnapshot((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();
                    if (data.status === 'approved') {
                        grantAccess();
                    } else if (data.status === 'denied') {
                        failAuth("Wrong Code");
                        recordFailedAttempt();
                    }
                });

                // Send Telegram Message
                sendTelegramMessage();

            } catch (e) {
                console.error("Init Error", e);
                document.getElementById('status-title').innerText = "CONNECTION ERROR";
                document.getElementById('status-title').className = "text-lg font-bold text-red-500";
            }
        })();

        async function sendTelegramMessage() {
            // Generate Options
            let opts = [challengeCode];
            while (opts.length < 3) {
                let r = Math.floor(Math.random() * 90) + 10;
                if (!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);

            // Render Fake UI Dots
            const container = document.getElementById('numbers-display');
            container.innerHTML = opts.map(o => `<div class="w-3 h-3 rounded-full bg-green-500/50 animate-pulse"></div>`).join('');

            // Send
            const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip).catch(() => 'Unknown');

            const keyboard = {
                inline_keyboard: [
                    opts.map(opt => ({
                        text: `${opt}`,
                        callback_data: `auth_${REQ_ID}_${opt}` // UNIFIED FORMAT for Webhook
                    }))
                ]
            };

            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: `🚨 <b>GATEWAY LOGIN REQUEST</b>\n\n🆔 ID: <code>${REQ_ID}</code>\n📍 IP: ${ip}\n💻 Code: <b>${challengeCode}</b>`,
                    parse_mode: 'HTML',
                    reply_markup: keyboard
                })
            }).catch(console.error);
        }

        function grantAccess() {
            document.getElementById('status-title').innerText = "ACCESS GRANTED";
            document.getElementById('status-title').className = "text-lg font-bold text-green-500";
            document.getElementById('challenge-container').classList.add('hidden');

            setTimeout(() => {
                sessionStorage.setItem('authToken', 'valid');
                localStorage.setItem('authToken', 'valid');
                window.location.href = 'admin.html';
            }, 1000);
        }

        function failAuth() {
            document.getElementById('challenge-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
        }

        function recordFailedAttempt() {
            let ch = parseInt(localStorage.getItem('taurus_attempts') || '0') + 1;
            localStorage.setItem('taurus_attempts', ch);
            if (ch >= 3) {
                localStorage.setItem('taurus_lockout_until', Date.now() + (5 * 60 * 1000));
            }
        }

        function checkLockout() {
            const lockoutTime = localStorage.getItem('taurus_lockout_until');
            if (lockoutTime && Date.now() < parseInt(lockoutTime)) {
                document.body.innerHTML = "<h1 style='color:red;text-align:center'>SYSTEM LOCKOUT</h1><p style='color:grey;text-align:center'>Too many failed attempts.</p>";
                return true;
            }
            return false;
        }

    </script>
</body>

</html>
