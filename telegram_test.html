<!DOCTYPE html>
<html>

<head>
    <title>Telegram Test</title>
</head>

<body>
    <h1>Telegram Diagnostic Test</h1>
    <button onclick="testTelegram()">Send Test Message</button>
    <pre id="result"></pre>

    <script>
        async function testTelegram() {
            const token = '8567285538:AAHKfo8bqee43rprC-GCv3Je423R57YQkCE';
            const chatId = '6886010817';
            const text = '🧪 <b>TEST MESSAGE</b>\n\nThis is a direct API test from diagnostic page.\nTime: ' + new Date().toLocaleString();

            const result = document.getElementById('result');
            result.textContent = 'Sending...';

            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);

                if (data.ok) {
                    alert('✅ Message sent successfully!');
                } else {
                    alert('❌ Telegram API Error: ' + data.description);
                }
            } catch (error) {
                result.textContent = 'ERROR: ' + error.message;
                alert('❌ Network Error: ' + error.message);
            }
        }
    </script>
</body>

</html>
