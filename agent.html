<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Taurus Agent | Ömer Yiğitler</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050505; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #050505; }
    #status {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      color: #FFD700;
      background: #050505;
      font: 700 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    #status.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="status">Taurus Agent açılıyor</div>
  <iframe id="admin-frame" src="/admin.html" title="Taurus Agent" allow="microphone"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('admin-frame');
      var status = document.getElementById('status');
      var timer = null;

      function stop() {
        if (timer) window.clearInterval(timer);
        timer = null;
      }

      function tryOpenAgent() {
        try {
          var doc = frame.contentDocument;
          if (!doc) return;

          var panel = doc.getElementById('agent-panel');
          if (panel && panel.classList.contains('open')) {
            status.classList.add('hidden');
            stop();
            return;
          }

          var logo = doc.querySelector('#sidebar-menu .logo-container');
          if (panel && logo) {
            logo.click();
            if (panel.classList.contains('open')) {
              status.classList.add('hidden');
              stop();
            }
          }
        } catch (_) {
          // The iframe remains same-origin; ignore transient navigation states.
        }
      }

      function watch() {
        stop();
        status.classList.remove('hidden');
        timer = window.setInterval(tryOpenAgent, 250);
        tryOpenAgent();
      }

      frame.addEventListener('load', watch);
      watch();
    })();
  </script>
</body>
</html>
