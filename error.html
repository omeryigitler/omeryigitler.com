<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata Oluştu | Ömer Yiğitler</title>
    <link rel="icon" href="assets/favicon1.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <!-- Meta Tags -->
    <meta name="description" content="An error occurred while sending your message. Please try again.">
    <meta name="robots" content="noindex, nofollow">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Syncopate"', 'sans-serif'],
                        body: ['"Manrope"', 'sans-serif'],
                    },
                    colors: {
                        obsidian: '#050505',
                        taurusGold: '#FFD700',
                    },
                    backgroundImage: {
                        'symmetry-grid': "radial-gradient(circle at center, transparent 0%, #050505 100%), linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px)",
                    },
                }
            }
        }
    </script>
    <style>
        .grid-bg {
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
    </style>
</head>

<body
    class="bg-obsidian text-white font-body h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-taurusGold selection:text-black">
    <div class="fixed inset-0 w-full h-full grid-bg bg-symmetry-grid -z-10 opacity-40"></div>

    <!-- Background Glow (Red/Orange hue for error? Or stick to Gold to maintain Brand?) -->
    <!-- Brand consistency is key. Let's keep Gold but maybe slightly dimmer or just standard. The user said "like when request received" so consistent beauty is important. -->
    <div
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-taurusGold/5 rounded-full blur-[100px] -z-10">
    </div>

    <div class="text-center p-8 max-w-lg relative z-10 animate-fade-in-up">
        <!-- Error Icon -->
        <div
            class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-8 border border-red-500/20 shadow-[0_0_30px_-5px_rgba(239,68,68,0.3)]">
            <i data-lucide="alert-triangle" class="w-10 h-10 text-red-500"></i>
        </div>

        <h1 class="font-display text-3xl md:text-4xl font-bold text-white mb-4">Bir Sorun Oluştu</h1>
        <p class="text-gray-400 text-sm leading-relaxed mb-10">
            Girdiğiniz e-posta adresi geçersiz olabilir veya bir bağlantı hatası meydana geldi. Lütfen bilgilerinizi
            kontrol edip tekrar deneyin.
        </p>

        <a href="index.html#contact"
            class="px-8 py-4 rounded-full border border-taurusGold bg-taurusGold text-black text-xs font-bold uppercase tracking-widest transition-all duration-300 hover:bg-obsidian hover:text-taurusGold hover:scale-105 active:scale-95 shadow-[0_0_20px_-5px_rgba(255,215,0,0.4)]">
            Tekrar Dene
        </a>
    </div>

    <footer class="absolute bottom-10 w-full text-center">
        <p class="text-gray-600 font-body tracking-widest text-[10px]">
            &copy; 2025 Ömer YİĞİTLER. System Alert.
        </p>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
