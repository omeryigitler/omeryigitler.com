<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React 3D Expertise Test</title>
  <link href="assets/css/styles.css?v=V10" rel="stylesheet" />
  <style>
    body { margin: 0; background: #050505; }
    #root { min-height: 100vh; }
    #boot-message { min-height: 100vh; display: grid; place-items: center; color: rgba(255,255,255,.55); font: 14px system-ui; }
    .react-card { transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
    .react-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(circle at 18% 10%, rgba(255,255,255,.12), transparent 30%), linear-gradient(135deg, rgba(255,255,255,.06), transparent 42%); opacity: .35; transition: opacity .35s ease; }
    .react-card::after { content: ""; position: absolute; top: -35%; bottom: -35%; left: -75%; width: 55%; border-radius: inherit; pointer-events: none; opacity: 0; transform: skewX(-22deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), rgba(255,255,255,.34), rgba(255,215,0,.16), transparent); filter: blur(1px); }
    .react-card:hover::before { opacity: .58; }
    .react-card:hover::after { animation: sweep .9s cubic-bezier(.23,1,.32,1) forwards; opacity: 1; }
    @keyframes sweep { from { transform: skewX(-22deg) translateX(0); } to { transform: skewX(-22deg) translateX(340%); } }
    .react-card > * { position: relative; z-index: 2; }
    .icon-box svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body class="text-white font-body overflow-x-hidden selection:bg-taurusGold selection:text-black">
  <div id="root"><div id="boot-message">Loading React 3D test...</div></div>

  <script type="module">
    import React, { useRef } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import { motion, useScroll, useTransform } from 'https://esm.sh/framer-motion@11.18.2';

    const e = React.createElement;

    function Icon({ type }) {
      if (type === 'design') {
        return e('svg', { viewBox: '0 0 24 24' },
          e('path', { d: 'M12 19l7-7 3 3-7 7-3-3z' }),
          e('path', { d: 'M18 13l-1.5-7.5L2 2l3.5 14.5L13 18' }),
          e('path', { d: 'M2 2l7.6 7.6' }),
          e('circle', { cx: '11', cy: '11', r: '2' })
        );
      }
      if (type === 'code') {
        return e('svg', { viewBox: '0 0 24 24' },
          e('path', { d: 'M16 18l6-6-6-6' }),
          e('path', { d: 'M8 6l-6 6 6 6' }),
          e('path', { d: 'M14.5 4l-5 16' })
        );
      }
      return e('svg', { viewBox: '0 0 24 24' },
        e('path', { d: 'M3 3v18h18' }),
        e('path', { d: 'M7 16v-5' }),
        e('path', { d: 'M12 16V7' }),
        e('path', { d: 'M17 16v-3' })
      );
    }

    function Bullet({ colorClass, children }) {
      return e('li', { className: 'flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider' },
        e('span', { className: 'w-1 h-1 rounded-full ' + colorClass }),
        children
      );
    }

    function CardContent({ type }) {
      const data = {
        design: {
          icon: 'design', iconHover: 'group-hover:text-taurusGold', lineHover: 'group-hover:via-taurusGold/50', title: 'UI/UX Design',
          text: 'Crafting intuitive, user-centric interfaces that not only look stunning but drive engagement and conversion.',
          bullet: 'bg-taurusGold', items: ['Figma & Prototyping', 'Design Systems', 'Mobile-First Layouts']
        },
        code: {
          icon: 'code', iconHover: 'group-hover:text-blue-400', lineHover: 'group-hover:via-blue-500/50', title: 'Engineering',
          text: 'Building robust, scalable, and high-performance web applications using modern technologies and clean code practices.',
          bullet: 'bg-blue-500', items: ['React / Next.js', 'Tailwind CSS', 'API Integration']
        },
        strategy: {
          icon: 'chart', iconHover: 'group-hover:text-emerald-400', lineHover: 'group-hover:via-emerald-500/50', title: 'Strategy & SEO',
          text: 'Optimizing for visibility and performance to ensure your digital product actually reaches and converts your target audience.',
          bullet: 'bg-emerald-500', items: ['Technical SEO', 'Performance Tuning', 'Analytics']
        }
      }[type];

      return e(React.Fragment, null,
        e('div', { className: 'absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent ' + data.lineHover + ' transition-all duration-500' }),
        type === 'code' ? e('div', { className: 'absolute bottom-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full blur-3xl -z-10 group-hover:bg-blue-500/10 transition-colors' }) : null,
        e('div', { className: 'icon-box w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center mb-6 text-gray-400 ' + data.iconHover + ' group-hover:scale-110 transition-all duration-300' },
          e(Icon, { type: data.icon })
        ),
        e('h3', { className: 'text-white font-display text-xl font-bold mb-3' }, data.title),
        e('p', { className: 'text-gray-500 text-xs leading-relaxed mb-6' }, data.text),
        e('ul', { className: 'space-y-2' }, data.items.map((item) => e(Bullet, { key: item, colorClass: data.bullet }, item)))
      );
    }

    function Expertise() {
      const containerRef = useRef(null);
      const scroll = useScroll({ target: containerRef, offset: ['start end', 'center center'] });
      const progress = scroll.scrollYProgress;

      const leftX = useTransform(progress, [0, 1], [-100, 0]);
      const leftZ = useTransform(progress, [0, 1], [-200, -50]);
      const leftRotateY = useTransform(progress, [0, 1], [45, 15]);

      const centerY = useTransform(progress, [0, 1], [100, 0]);
      const centerScale = useTransform(progress, [0, 1], [0.8, 1.05]);
      const centerZ = useTransform(progress, [0, 1], [-50, 50]);

      const rightX = useTransform(progress, [0, 1], [100, 0]);
      const rightZ = useTransform(progress, [0, 1], [-200, -50]);
      const rightRotateY = useTransform(progress, [0, 1], [-45, -15]);

      const cardBase = 'react-card group p-8 rounded-3xl bg-neutral-900/40 border border-white/5 backdrop-blur-sm relative overflow-hidden';

      return e('main', { className: 'w-full min-h-screen flex flex-col items-center px-4 py-32 bg-obsidian' },
        e('section', { ref: containerRef, className: 'w-full max-w-6xl mt-20 mb-40 relative z-10 scroll-mt-40' },
          e(motion.div, {
            initial: { opacity: 0, y: 40 },
            whileInView: { opacity: 1, y: 0 },
            viewport: { once: true, amount: 0.2 },
            transition: { duration: 0.8 },
            className: 'text-center mb-16 relative'
          },
            e('span', { className: 'px-4 py-1.5 rounded-full bg-taurusGold/10 border border-taurusGold/20 text-taurusGold text-[10px] font-bold uppercase tracking-widest inline-block mb-4' }, 'What I Do'),
            e('h2', { className: 'font-display text-3xl md:text-5xl font-bold text-white mb-4' },
              'Complete Digital ', e('br'), e('span', { className: 'text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500' }, 'Solutions')
            ),
            e('p', { className: 'text-gray-400 text-sm max-w-xl mx-auto' }, 'A holistic approach to digital product creation, ensuring every layer from design to deployment is crafted to perfection.')
          ),
          e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6 px-4', style: { perspective: '1200px', transformStyle: 'preserve-3d' } },
            e(motion.div, {
              style: { x: leftX, z: leftZ, rotateY: leftRotateY },
              whileHover: { rotateY: 0, z: 20, scale: 1.02 },
              transition: { duration: 0.4 },
              className: cardBase + ' hover:bg-neutral-900/60 hover:border-taurusGold/30'
            }, e(CardContent, { type: 'design' })),
            e(motion.div, {
              style: { y: centerY, scale: centerScale, z: centerZ },
              whileHover: { scale: 1.08, z: 80 },
              transition: { duration: 0.4 },
              className: cardBase + ' hover:bg-neutral-900/60 hover:border-blue-500/30 md:-mt-8'
            }, e(CardContent, { type: 'code' })),
            e(motion.div, {
              style: { x: rightX, z: rightZ, rotateY: rightRotateY },
              whileHover: { rotateY: 0, z: 20, scale: 1.02 },
              transition: { duration: 0.4 },
              className: cardBase + ' hover:bg-neutral-900/60 hover:border-emerald-500/30'
            }, e(CardContent, { type: 'strategy' }))
          )
        ),
        e('div', { className: 'h-[80vh]' })
      );
    }

    createRoot(document.getElementById('root')).render(e(Expertise));
  </script>
</body>
</html>
