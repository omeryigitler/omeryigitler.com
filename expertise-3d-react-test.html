<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React 3D Expertise Test</title>
  <link href="assets/css/styles.css?v=V10" rel="stylesheet" />
  <style>
    body { margin: 0; background: #050505; }
    .react-card { transform-style: preserve-3d; backface-visibility: hidden; }
    .react-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(circle at 18% 10%, rgba(255,255,255,.12), transparent 30%), linear-gradient(135deg, rgba(255,255,255,.06), transparent 42%); opacity: .35; transition: opacity .35s ease; }
    .react-card::after { content: ""; position: absolute; top: -35%; bottom: -35%; left: -75%; width: 55%; border-radius: inherit; pointer-events: none; opacity: 0; transform: skewX(-22deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), rgba(255,255,255,.34), rgba(255,215,0,.16), transparent); filter: blur(1px); }
    .react-card:hover::before { opacity: .58; }
    .react-card:hover::after { animation: sweep .9s cubic-bezier(.23,1,.32,1) forwards; opacity: 1; }
    @keyframes sweep { from { transform: skewX(-22deg) translateX(0); } to { transform: skewX(-22deg) translateX(340%); } }
    .react-card > * { position: relative; z-index: 2; }
  </style>
</head>
<body class="text-white font-body overflow-x-hidden selection:bg-taurusGold selection:text-black">
  <div id="root"></div>

  <script type="module">
    import React, { useRef } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import { motion, useScroll, useTransform } from 'https://esm.sh/framer-motion@11.18.2';
    import { PenTool, Code2, BarChart3 } from 'https://esm.sh/lucide-react@0.468.0';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    function CardContent({ type }) {
      if (type === 'design') {
        return html`
          <>
            <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent group-hover:via-taurusGold/50 transition-all duration-500" />
            <div className="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
              <${PenTool} className="w-6 h-6 text-gray-400 group-hover:text-taurusGold transition-colors" />
            </div>
            <h3 className="text-white font-display text-xl font-bold mb-3">UI/UX Design</h3>
            <p className="text-gray-500 text-xs leading-relaxed mb-6">Crafting intuitive, user-centric interfaces that not only look stunning but drive engagement and conversion.</p>
            <ul className="space-y-2">
              <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-taurusGold" /> Figma & Prototyping</li>
              <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-taurusGold" /> Design Systems</li>
              <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-taurusGold" /> Mobile-First Layouts</li>
            </ul>
          </>
        `;
      }

      if (type === 'engineering') {
        return html`
          <>
            <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent group-hover:via-blue-500/50 transition-all duration-500" />
            <div className="absolute bottom-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full blur-3xl -z-10 group-hover:bg-blue-500/10 transition-colors" />
            <div className="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
              <${Code2} className="w-6 h-6 text-gray-400 group-hover:text-blue-400 transition-colors" />
            </div>
            <h3 className="text-white font-display text-xl font-bold mb-3">Engineering</h3>
            <p className="text-gray-500 text-xs leading-relaxed mb-6">Building robust, scalable, and high-performance web applications using modern technologies and clean code practices.</p>
            <ul className="space-y-2">
              <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-blue-500" /> React / Next.js</li>
              <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-blue-500" /> Tailwind CSS</li>
              <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-blue-500" /> API Integration</li>
            </ul>
          </>
        `;
      }

      return html`
        <>
          <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent group-hover:via-emerald-500/50 transition-all duration-500" />
          <div className="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300">
            <${BarChart3} className="w-6 h-6 text-gray-400 group-hover:text-emerald-400 transition-colors" />
          </div>
          <h3 className="text-white font-display text-xl font-bold mb-3">Strategy & SEO</h3>
          <p className="text-gray-500 text-xs leading-relaxed mb-6">Optimizing for visibility and performance to ensure your digital product actually reaches and converts your target audience.</p>
          <ul className="space-y-2">
            <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-emerald-500" /> Technical SEO</li>
            <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-emerald-500" /> Performance Tuning</li>
            <li className="flex items-center gap-2 text-[10px] text-gray-400 font-bold uppercase tracking-wider"><span className="w-1 h-1 rounded-full bg-emerald-500" /> Analytics</li>
          </ul>
        </>
      `;
    }

    function Expertise() {
      const containerRef = useRef(null);
      const { scrollYProgress } = useScroll({
        target: containerRef,
        offset: ['start end', 'center center']
      });

      const leftX = useTransform(scrollYProgress, [0, 1], [-100, 0]);
      const leftZ = useTransform(scrollYProgress, [0, 1], [-200, -50]);
      const leftRotateY = useTransform(scrollYProgress, [0, 1], [45, 15]);

      const centerY = useTransform(scrollYProgress, [0, 1], [100, 0]);
      const centerScale = useTransform(scrollYProgress, [0, 1], [0.8, 1.05]);
      const centerZ = useTransform(scrollYProgress, [0, 1], [-50, 50]);

      const rightX = useTransform(scrollYProgress, [0, 1], [100, 0]);
      const rightZ = useTransform(scrollYProgress, [0, 1], [-200, -50]);
      const rightRotateY = useTransform(scrollYProgress, [0, 1], [-45, -15]);

      return html`
        <main className="w-full min-h-screen flex flex-col items-center px-4 py-32 bg-obsidian">
          <section ref=${containerRef} className="w-full max-w-6xl mt-20 mb-40 relative z-10 scroll-mt-40">
            <${motion.div}
              initial=${{ opacity: 0, y: 40 }}
              whileInView=${{ opacity: 1, y: 0 }}
              viewport=${{ once: true, amount: 0.2 }}
              transition=${{ duration: 0.8 }}
              className="text-center mb-16 relative"
            >
              <span className="px-4 py-1.5 rounded-full bg-taurusGold/10 border border-taurusGold/20 text-taurusGold text-[10px] font-bold uppercase tracking-widest inline-block mb-4">What I Do</span>
              <h2 className="font-display text-3xl md:text-5xl font-bold text-white mb-4">
                Complete Digital <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">Solutions</span>
              </h2>
              <p className="text-gray-400 text-sm max-w-xl mx-auto">A holistic approach to digital product creation, ensuring every layer from design to deployment is crafted to perfection.</p>
            <//>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 px-4" style=${{ perspective: '1200px', transformStyle: 'preserve-3d' }}>
              <${motion.div}
                style=${{ x: leftX, z: leftZ, rotateY: leftRotateY }}
                whileHover=${{ rotateY: 0, z: 20, scale: 1.02 }}
                transition=${{ duration: 0.4 }}
                className="react-card group p-8 rounded-3xl bg-neutral-900/40 border border-white/5 backdrop-blur-sm hover:bg-neutral-900/60 hover:border-taurusGold/30 relative overflow-hidden"
              >
                <${CardContent} type="design" />
              <//>

              <${motion.div}
                style=${{ y: centerY, scale: centerScale, z: centerZ }}
                whileHover=${{ scale: 1.08, z: 80 }}
                transition=${{ duration: 0.4 }}
                className="react-card group p-8 rounded-3xl bg-neutral-900/40 border border-white/5 backdrop-blur-sm hover:bg-neutral-900/60 hover:border-blue-500/30 relative overflow-hidden md:-mt-8"
              >
                <${CardContent} type="engineering" />
              <//>

              <${motion.div}
                style=${{ x: rightX, z: rightZ, rotateY: rightRotateY }}
                whileHover=${{ rotateY: 0, z: 20, scale: 1.02 }}
                transition=${{ duration: 0.4 }}
                className="react-card group p-8 rounded-3xl bg-neutral-900/40 border border-white/5 backdrop-blur-sm hover:bg-neutral-900/60 hover:border-emerald-500/30 relative overflow-hidden"
              >
                <${CardContent} type="strategy" />
              <//>
            </div>
          </section>
          <div className="h-[80vh]" />
        </main>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${Expertise} />`);
  </script>
</body>
</html>
