name: One-time admin security hardening

on:
  push:
    paths:
      - .github/workflows/security-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden admin client
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')

          def sub_once(pattern, replacement, label, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')

          if 'style="visibility:hidden"' not in text:
              sub_once(
                  r'<body class="bg-obsidian text-white font-body h-screen flex overflow-hidden">',
                  '<body class="bg-obsidian text-white font-body h-screen flex overflow-hidden" style="visibility:hidden">',
                  'body visibility guard'
              )

          sub_once(
              r'\s*<!--AUTH GUARD-->\s*<script>\s*if \(sessionStorage\.getItem\(\'authToken\'\).*?</script>\s*',
              '\n    <!-- Authentication is verified below with Firebase ID-token claims. -->\n',
              'localStorage auth guard',
              re.S,
          )

          admin_auth = r'''        document.addEventListener('DOMContentLoaded', async () => {
                      const rejectAdminSession = async () => {
                          try {
                              if (window.firebase && firebase.auth) await firebase.auth().signOut();
                          } catch (_) {}
                          sessionStorage.removeItem('authToken');
                          localStorage.removeItem('authToken');
                          window.location.replace('gateway.html');
                      };

                      try {
                          if (!window.firebaseConfig || window.firebaseConfig.apiKey === "BURAYA_API_KEY_GELECEK") {
                              throw new Error('Firebase configuration unavailable');
                          }
                          if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
                          const auth = firebase.auth();
                          await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

                          auth.onAuthStateChanged(async (user) => {
                              if (!user || user.isAnonymous) return rejectAdminSession();
                              try {
                                  const tokenResult = await user.getIdTokenResult(true);
                                  const claims = tokenResult.claims || {};
                                  if (claims.admin !== true || claims.role !== 'admin') {
                                      return rejectAdminSession();
                                  }

                                  db = firebase.firestore();
                                  window.db = db;
                                  window.auth = auth;
                                  if (firebase.storage) window.storage = firebase.storage();
                                  document.body.style.visibility = 'visible';

                                  setupRealtimeListeners();
                                  loadTrafficChart();
                                  startAutoPipelineListener();

                                  setInterval(() => {
                                      const ping = Math.floor(Math.random() * 15) + 12;
                                      const metaEl = document.getElementById('live-metadata');
                                      if (metaEl) metaEl.innerText = `MS-Pulse: ${ping}ms`;
                                  }, 3000);
                              } catch (error) {
                                  console.error('Admin claim verification failed:', error);
                                  return rejectAdminSession();
                              }
                          });
                      } catch (error) {
                          console.error('Admin authentication initialization failed:', error);
                          return rejectAdminSession();
                      }
                  });

                  // POST MESSAGE LISTENER - Pricing Tool Integration'''

          sub_once(
              r"\s{8}document\.addEventListener\('DOMContentLoaded', \(\) => \{.*?\n\s{8}\}\);\n\n\s*// POST MESSAGE LISTENER - Pricing Tool Integration",
              '\n' + admin_auth,
              'Firebase admin-claim guard',
              re.S,
          )

          safe_highlight = r'''        function escapeHtml(value) {
                      return String(value ?? '')
                          .replace(/&/g, '&amp;')
                          .replace(/</g, '&lt;')
                          .replace(/>/g, '&gt;')
                          .replace(/"/g, '&quot;')
                          .replace(/'/g, '&#39;');
                  }

                  function escapeRegExp(value) {
                      return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                  }

                  function highlightMatch(value, query) {
                      const safeValue = escapeHtml(value);
                      if (!query) return safeValue;
                      try {
                          const safeQuery = escapeRegExp(escapeHtml(query));
                          const regex = new RegExp(`(${safeQuery})`, 'gi');
                          return safeValue.replace(regex, '<span class="search-highlight">$1</span>');
                      } catch (_) {
                          return safeValue;
                      }
                  }

                  function filterMessages'''

          sub_once(
              r"\s{8}function highlightMatch\(text, query\) \{.*?\n\s{8}\}\n\n\s{8}function filterMessages",
              '\n' + safe_highlight,
              'HTML escaping helper',
              re.S,
          )

          for old, new in {
              "${data.name || 'Anonymous'}": "${escapeHtml(data.name || 'Anonymous')}",
              "${data.email || ''}": "${escapeHtml(data.email || '')}",
              "${data.message || ''}": "${escapeHtml(data.message || '')}",
          }.items():
              text = text.replace(old, new)

          marker = "        window.addEventListener('message', async (event) => {\n"
          if marker not in text:
              raise SystemExit('postMessage listener marker not found')
          text = text.replace(marker, """        window.addEventListener('message', async (event) => {
                      const pricingFrame = document.getElementById('pricing-iframe');
                      if (event.origin !== window.location.origin || !pricingFrame || event.source !== pricingFrame.contentWindow) {
                          return;
                      }
          """, 1)
          text = text.replace("}, '*');", "}, window.location.origin);")

          telegram_managed = r'''            async function saveTelegramInitial() {
                          if (teleTokenInput) {
                              teleTokenInput.value = '';
                              teleTokenInput.disabled = true;
                              teleTokenInput.placeholder = 'Managed securely in Vercel environment variables';
                          }
                          if (teleChatIdInput) {
                              teleChatIdInput.value = '';
                              teleChatIdInput.disabled = true;
                              teleChatIdInput.placeholder = 'Managed securely in Vercel environment variables';
                          }
                      }

                      if (teleTokenInput) saveTelegramInitial();

                      document.getElementById('save-telegram-btn')?.addEventListener('click', async () => {
                          await systemAlert(
                              'SERVER-MANAGED SECURITY',
                              'Telegram credentials are stored only in Vercel environment variables and cannot be viewed or changed in the browser.',
                              'shield-check'
                          );
                      });

                      securitySettingsInitialized = true;'''

          sub_once(
              r"\s{12}async function saveTelegramInitial\(\) \{.*?\s{12}securitySettingsInitialized = true;",
              '\n' + telegram_managed,
              'Telegram browser-secret block',
              re.S,
          )

          if re.search(r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b', text):
              raise SystemExit('A Telegram bot token still exists in admin.html')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/security-hotfix.yml').unlink()
          PY

      - name: Commit hardened admin
        shell: bash
        run: |
          git config user.name "taurus-security-bot"
          git config user.email "security@omeryigitler.com"
          git add admin.html .github/workflows/security-hotfix.yml
          git commit -m "Harden admin authentication, secrets and rendering"
          git push origin HEAD:main
