name: Currency and percent formatting fix

on:
  push:
    paths:
      - '.github/workflows/currency-percent-format-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply formatting fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count} for {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Pricing calculator: TCMB-style TRY display and locale-aware percent placement.
          replace_exact(
              'pricing-tool/components/PricingCalculator.tsx',
              "return `${amount.toLocaleString('tr-TR', { maximumFractionDigits: 0 })} ${config[Country.TR].currencySymbol}`;",
              "return `${config[Country.TR].currencySymbol}${amount.toLocaleString('tr-TR', { maximumFractionDigits: 0 })}`;"
          )
          replace_exact(
              'pricing-tool/components/PricingCalculator.tsx',
              "return `+${factor.value}%`;",
              "return request.country === Country.TR ? `+%${factor.value}` : `+${factor.value}%`;"
          )
          replace_exact(
              'pricing-tool/components/PricingCalculator.tsx',
              "const showSymbolLeft = (!isPercentage && !isTr) || (isPercentage && isTr);\n                      const showSymbolRight = (!isPercentage && isTr) || (isPercentage && !isTr);",
              "const showSymbolLeft = !isPercentage || isTr;\n                      const showSymbolRight = isPercentage && !isTr;"
          )

          # Proposal: currency prefix in Turkish and locale-aware percentages everywhere.
          replace_exact(
              'pricing-tool/components/ProposalView.tsx',
              "// STRICT TDK FORMATTING\n  const formatCurrency = (val: number) => {\n    if (request.country === Country.TR) {\n      // TR: 10.000 ₺\n      return `${Math.round(val).toLocaleString('tr-TR', { maximumFractionDigits: 0 })} ${rules.currencySymbol}`;\n    } else {\n      // MT: €1,000\n      return `${rules.currencySymbol}${Math.round(val).toLocaleString('en-GB', { maximumFractionDigits: 0 })}`;\n    }\n  };",
              "// Locale-aware official display formatting\n  const formatCurrency = (val: number) => {\n    if (request.country === Country.TR) {\n      // TR: ₺10.000\n      return `${rules.currencySymbol}${Math.round(val).toLocaleString('tr-TR', { maximumFractionDigits: 0 })}`;\n    } else {\n      // MT: €1,000\n      return `${rules.currencySymbol}${Math.round(val).toLocaleString('en-GB', { maximumFractionDigits: 0 })}`;\n    }\n  };\n\n  const formatPercent = (value: number) =>\n    request.country === Country.TR ? `%${value}` : `${value}%`;"
          )
          replace_exact(
              'pricing-tool/components/ProposalView.tsx',
              "return `+${factor.value}%`;",
              "return `+${formatPercent(factor.value)}`;"
          )
          replace_exact(
              'pricing-tool/components/ProposalView.tsx',
              "<span className=\"text-xs text-indigo-600 ml-1 font-bold\">({priceFactor.value}%)</span>",
              "<span className=\"text-xs text-indigo-600 ml-1 font-bold\">({formatPercent(priceFactor.value)})</span>"
          )
          replace_exact(
              'pricing-tool/components/ProposalView.tsx',
              "` (%${rules.maintenanceRates[request.maintenanceLevel].value})`",
              "` (${formatPercent(rules.maintenanceRates[request.maintenanceLevel].value)})`"
          )

          # Contract screen/HTML PDF.
          replace_exact(
              'pricing-tool/components/ContractView.tsx',
              "// STRICT TDK FORMATTING HELPER\n  const fmt = (val: number) => {\n    if (request.country === Country.TR) {\n      // TR: 10.000 ₺\n      return `${Math.round(val).toLocaleString('tr-TR', { maximumFractionDigits: 0 })} ${rules.currencySymbol}`;\n    } else {\n      // MT: €1,000\n      return `${rules.currencySymbol}${Math.round(val).toLocaleString('en-GB', { maximumFractionDigits: 0 })}`;\n    }\n  };",
              "// Locale-aware official display formatting\n  const fmt = (val: number) => {\n    if (request.country === Country.TR) {\n      // TR: ₺10.000\n      return `${rules.currencySymbol}${Math.round(val).toLocaleString('tr-TR', { maximumFractionDigits: 0 })}`;\n    } else {\n      // MT: €1,000\n      return `${rules.currencySymbol}${Math.round(val).toLocaleString('en-GB', { maximumFractionDigits: 0 })}`;\n    }\n  };"
          )

          # Package table prices.
          replace_exact(
              'pricing-tool/components/PackageTable.tsx',
              "// TR: 10.000 ₺ (Space before symbol)\n  // MT: €1,000 (Symbol first, comma separator)",
              "// TR: ₺10.000 (Symbol first, Turkish grouping)\n  // MT: €1,000 (Symbol first, English grouping)"
          )
          replace_exact('pricing-tool/components/PackageTable.tsx', "priceTR: '10.000 ₺'", "priceTR: '₺10.000'")
          replace_exact('pricing-tool/components/PackageTable.tsx', "priceTR: '25.000 ₺'", "priceTR: '₺25.000'")
          replace_exact('pricing-tool/components/PackageTable.tsx', "priceTR: '50.000 ₺'", "priceTR: '₺50.000'")

          # Native PDF fallback: use the correct locale separators for each currency.
          replace_exact(
              'pricing-tool/utils/pdfGenerator.ts',
              "const currency = request.country === Country.TR ? '₺' : '€';",
              "const currency = request.country === Country.TR ? '₺' : '€';\n    const locale = request.country === Country.TR ? 'tr-TR' : 'en-GB';"
          )
          replace_exact(
              'pricing-tool/utils/pdfGenerator.ts',
              "`${currency}${value.toLocaleString(undefined, { minimumFractionDigits: 2 })}`",
              "`${currency}${value.toLocaleString(locale, { minimumFractionDigits: 2 })}`"
          )
          replace_exact(
              'pricing-tool/utils/pdfGenerator.ts',
              "`-${currency}${breakdown.discountAmount.toLocaleString()}`",
              "`-${currency}${breakdown.discountAmount.toLocaleString(locale)}`"
          )
          replace_exact(
              'pricing-tool/utils/pdfGenerator.ts',
              "`${currency}${breakdown.finalTotal.toLocaleString(undefined, { minimumFractionDigits: 2 })}`",
              "`${currency}${breakdown.finalTotal.toLocaleString(locale, { minimumFractionDigits: 2 })}`"
          )
          replace_exact(
              'pricing-tool/utils/pdfGenerator.ts',
              "`${currency}${breakdown.totalMonthly.toLocaleString()}/${lang === Language.TR ? 'ay' : 'mo'}.`",
              "`${currency}${breakdown.totalMonthly.toLocaleString(locale)}/${lang === Language.TR ? 'ay' : 'mo'}.`"
          )
          replace_exact(
              'pricing-tool/utils/pdfGenerator.ts',
              "const fmt = (val: number) => `${currency}${val.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;",
              "const fmt = (val: number) => `${currency}${val.toLocaleString(locale, { minimumFractionDigits: 2 })}`;"
          )

          # Admin: one formatter for TRY/EUR, then use it in all financial displays.
          replace_exact(
              'admin.html',
              "        function calculateFactorCost(baseAmount, factor) {\n            if (!factor) return 0;\n            if (factor.type === 'PERCENTAGE') return baseAmount * (factor.value / 100);\n            return factor.value || 0;\n        }",
              "        function calculateFactorCost(baseAmount, factor) {\n            if (!factor) return 0;\n            if (factor.type === 'PERCENTAGE') return baseAmount * (factor.value / 100);\n            return factor.value || 0;\n        }\n\n        function formatAdminMoney(value, currency = 'TRY') {\n            const isEuro = currency === 'EUR';\n            const symbol = isEuro ? '€' : '₺';\n            const locale = isEuro ? 'en-GB' : 'tr-TR';\n            return symbol + Number(value || 0).toLocaleString(locale, { maximumFractionDigits: 0 });\n        }"
          )
          replace_exact(
              'admin.html',
              "${quote.totalPrice || 0} ${quote.currency || 'TRY'}",
              "${formatAdminMoney(quote.totalPrice || 0, quote.currency || 'TRY')}"
          )
          replace_exact(
              'admin.html',
              "${item.data.siteType || 'N/A'} - ${item.data.totalPrice || 0} ${item.data.currency || 'TRY'}",
              "${item.data.siteType || 'N/A'} - ${formatAdminMoney(item.data.totalPrice || 0, item.data.currency || 'TRY')}"
          )
          replace_exact('admin.html', '<span class="text-taurusGold">%${progress}</span>', '<span class="text-taurusGold">${progress}%</span>')
          replace_exact(
              'admin.html',
              "${budget ? budget.toLocaleString('tr-TR') + ' ' + (data.currency || 'TRY') : '—'}",
              "${budget ? formatAdminMoney(budget, data.currency || 'TRY') : '—'}"
          )
          replace_exact(
              'admin.html',
              "            const symbol = currency === 'EUR' ? '€' : '₺';",
              "            const formatMoney = (value) => formatAdminMoney(value, currency);"
          )
          replace_exact('admin.html', "${symbol}${breakdown.base?.toLocaleString() || 0}", "${formatMoney(breakdown.base)}")
          replace_exact('admin.html', "${symbol}${breakdown.pages?.toLocaleString() || 0}", "${formatMoney(breakdown.pages)}")
          replace_exact('admin.html', "${symbol}${breakdown[f.k]?.toLocaleString()}", "${formatMoney(breakdown[f.k])}")
          replace_exact('admin.html', "-${symbol}${breakdown.discountAmount?.toLocaleString()}", "-${formatMoney(breakdown.discountAmount)}")
          replace_exact(
              'admin.html',
              "totalDisplay.innerText = symbol + (breakdown.finalTotal?.toLocaleString() || 0);",
              "totalDisplay.innerText = formatMoney(breakdown.finalTotal);"
          )
          PY

      - name: Build pricing tool
        working-directory: pricing-tool
        run: |
          npm ci
          npm run build

      - name: Verify formatting
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          calc = Path('pricing-tool/components/PricingCalculator.tsx').read_text(encoding='utf-8')
          proposal = Path('pricing-tool/components/ProposalView.tsx').read_text(encoding='utf-8')
          contract = Path('pricing-tool/components/ContractView.tsx').read_text(encoding='utf-8')
          packages = Path('pricing-tool/components/PackageTable.tsx').read_text(encoding='utf-8')
          pdf = Path('pricing-tool/utils/pdfGenerator.ts').read_text(encoding='utf-8')
          admin = Path('admin.html').read_text(encoding='utf-8')
          dist_index = Path('pricing-tool/dist/index.html').read_text(encoding='utf-8')

          assert "`${config[Country.TR].currencySymbol}${amount.toLocaleString('tr-TR'" in calc
          assert "request.country === Country.TR ? `+%${factor.value}` : `+${factor.value}%`" in calc
          assert 'const showSymbolLeft = !isPercentage || isTr;' in calc
          assert 'const showSymbolRight = isPercentage && !isTr;' in calc

          assert '// TR: ₺10.000' in proposal
          assert '({formatPercent(priceFactor.value)})' in proposal
          assert 'formatPercent(rules.maintenanceRates[request.maintenanceLevel].value)' in proposal
          assert '// TR: ₺10.000' in contract
          assert "priceTR: '₺10.000'" in packages
          assert "priceTR: '₺25.000'" in packages
          assert "priceTR: '₺50.000'" in packages
          assert "const locale = request.country === Country.TR ? 'tr-TR' : 'en-GB';" in pdf
          assert 'toLocaleString(undefined' not in pdf

          assert 'function formatAdminMoney' in admin
          assert '${progress}%' in admin
          assert '%${progress}' not in admin
          assert "formatAdminMoney(quote.totalPrice || 0, quote.currency || 'TRY')" in admin
          assert "formatAdminMoney(item.data.totalPrice || 0, item.data.currency || 'TRY')" in admin
          assert "formatAdminMoney(budget, data.currency || 'TRY')" in admin
          assert 'const formatMoney = (value) => formatAdminMoney(value, currency);' in admin
          assert "const symbol = currency === 'EUR' ? '€' : '₺';" not in admin

          assert 'assets/index-' in dist_index
          assert Path('pricing-tool/dist/assets').is_dir()
          print('Formatting checks passed.')
          PY

      - name: Commit source and rebuilt distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/currency-percent-format-fix.yml
          git add admin.html \
            pricing-tool/components/PricingCalculator.tsx \
            pricing-tool/components/ProposalView.tsx \
            pricing-tool/components/ContractView.tsx \
            pricing-tool/components/PackageTable.tsx \
            pricing-tool/utils/pdfGenerator.ts \
            pricing-tool/dist
          git diff --cached --check
          git status --short
          git commit -m "Standardize currency and percent formatting"
          git push origin HEAD:main
