name: Install Built with Seyhan portfolio entry

on:
  push:
    paths:
      - .github/workflows/install-builtwithseyhan.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production deployment
        run: sleep 90
      - name: Install portfolio record and previews
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 10 \
            --max-time 70 \
            https://omeryigitler.com/api/install-builtwithseyhan-once
