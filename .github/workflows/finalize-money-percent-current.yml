name: Finalize money and percent formatting

on:
  push:
    branches:
      - fix/currency-percent-formatting
    paths:
      - .github/workflows/finalize-money-percent-current.yml

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/currency-percent-formatting
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pricing-tool/package-lock.json

      - name: Apply remaining fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f"patched: {label}")

          # Public English copy: percent sign follows the number with no space.
          replace_once(
              'index.html',
              '<div class="num">100</div>\n                        <div class="label">% hand-coded</div>',
              '<div class="num">100%</div>\n                        <div class="label">hand-coded</div>',
              'homepage percent display')

          # Admin pricing settings store percentage factors as whole percentage points.
          replace_once(
              'pricing-tool/translations.ts',
              "multiplierDesc: 'Örn: 0.30 değeri %30 artış anlamına gelir. 1.5 değeri x1.5 katı demektir.'",
              "multiplierDesc: 'Örn: 30 değeri %30 artış anlamına gelir. 1.5 değeri x1.5 katı demektir.'",
              'Turkish percentage example')
          replace_once(
              'pricing-tool/translations.ts',
              "multiplierDesc: 'Ex: 0.30 means 30% increase. 1.5 means x1.5 multiplier.'",
              "multiplierDesc: 'Ex: 30 means a 30% increase. 1.5 means x1.5 multiplier.'",
              'English percentage example')

          # Native PDF: match the UI standard (₺10.000 / €1,000) instead of forcing .00 decimals.
          replace_once(
              'pricing-tool/utils/pdfGenerator.ts',
              "    const locale = request.country === Country.TR ? 'tr-TR' : 'en-GB';\n    const pageWidth",
              "    const locale = request.country === Country.TR ? 'tr-TR' : 'en-GB';\n    const formatMoney = (value: number) => `${currency}${Math.round(value).toLocaleString(locale, { maximumFractionDigits: 0 })}`;\n    const pageWidth",
              'native PDF money helper')
          replace_once(
              'pricing-tool/utils/pdfGenerator.ts',
              "doc.text(`${currency}${value.toLocaleString(locale, { minimumFractionDigits: 2 })}`, pageWidth - margin - 5, y, { align: 'right' });",
              "doc.text(formatMoney(value), pageWidth - margin - 5, y, { align: 'right' });",
              'native PDF line item')
          replace_once(
              'pricing-tool/utils/pdfGenerator.ts',
              "doc.text(`-${currency}${breakdown.discountAmount.toLocaleString(locale)}`, pageWidth - margin - 5, y, { align: 'right' });",
              "doc.text(`-${formatMoney(breakdown.discountAmount)}`, pageWidth - margin - 5, y, { align: 'right' });",
              'native PDF discount')
          replace_once(
              'pricing-tool/utils/pdfGenerator.ts',
              "doc.text(`${currency}${breakdown.finalTotal.toLocaleString(locale, { minimumFractionDigits: 2 })}`, pageWidth - margin - 5, y + 2, { align: 'right' });",
              "doc.text(formatMoney(breakdown.finalTotal), pageWidth - margin - 5, y + 2, { align: 'right' });",
              'native PDF final total')
          replace_once(
              'pricing-tool/utils/pdfGenerator.ts',
              "doc.text(`* ${c.monthlyService}: ${currency}${breakdown.totalMonthly.toLocaleString(locale)}/${lang === Language.TR ? 'ay' : 'mo'}.`, margin, y);",
              "doc.text(`* ${c.monthlyService}: ${formatMoney(breakdown.totalMonthly)}/${lang === Language.TR ? 'ay' : 'mo'}.`, margin, y);",
              'native PDF monthly total')
          replace_once(
              'pricing-tool/utils/pdfGenerator.ts',
              "const fmt = (val: number) => `${currency}${val.toLocaleString(locale, { minimumFractionDigits: 2 })}`;",
              "const fmt = (val: number) => formatMoney(val);",
              'native PDF contract money helper')

          # Verify all relevant locale rules in source.
          files = {
              'calc': Path('pricing-tool/components/PricingCalculator.tsx').read_text(encoding='utf-8'),
              'proposal': Path('pricing-tool/components/ProposalView.tsx').read_text(encoding='utf-8'),
              'contract': Path('pricing-tool/components/ContractView.tsx').read_text(encoding='utf-8'),
              'packages': Path('pricing-tool/components/PackageTable.tsx').read_text(encoding='utf-8'),
              'seo': Path('pricing-tool/components/SeoTracker.tsx').read_text(encoding='utf-8'),
              'pdf': Path('pricing-tool/utils/pdfGenerator.ts').read_text(encoding='utf-8'),
              'translations': Path('pricing-tool/translations.ts').read_text(encoding='utf-8'),
              'admin': Path('admin.html').read_text(encoding='utf-8'),
              'home': Path('index.html').read_text(encoding='utf-8'),
          }

          assert "`${config[Country.TR].currencySymbol}${amount.toLocaleString('tr-TR'" in files['calc']
          assert "request.country === Country.TR ? `+%${factor.value}` : `+${factor.value}%`" in files['calc']
          assert "request.country === Country.TR ? `%${value}` : `${value}%`" in files['proposal']
          assert "language === Language.TR ? `%${value}` : `${value}%`" in files['seo']
          assert "priceTR: '₺10.000'" in files['packages']
          assert "request.country === Country.TR ? 'TL' : 'EUR'" in files['contract']
          assert "const formatMoney = (value: number)" in files['pdf']
          assert 'minimumFractionDigits: 2' not in files['pdf']
          assert '0.30 değeri %30' not in files['translations']
          assert '0.30 means 30%' not in files['translations']
          assert '<div class="num">100%</div>' in files['home']
          assert '<div class="label">% hand-coded</div>' not in files['home']
          assert 'function formatAdminMoney' in files['admin']
          assert '<span class="text-taurusGold">${progress}%</span>' in files['admin']
          print('source locale verification passed')
          PY

      - name: Check source diff hygiene
        run: git diff --check -- index.html pricing-tool/translations.ts pricing-tool/utils/pdfGenerator.ts

      - name: Build Pricing Tool
        working-directory: pricing-tool
        run: |
          npm ci
          npm run build

      - name: Verify built output
        shell: bash
        run: |
          test -f pricing-tool/dist/index.html
          grep -R -q "tr-TR" pricing-tool/dist/assets
          grep -R -q "en-GB" pricing-tool/dist/assets
          grep -R -q "Ödemeler" pricing-tool/dist/assets
          if grep -R -q "10.000 ₺" pricing-tool/dist/assets; then
            echo "Old suffix TRY display remains in built assets" >&2
            exit 1
          fi
          if grep -R -q "0.30 değeri %30" pricing-tool/dist/assets; then
            echo "Old Turkish percentage example remains in built assets" >&2
            exit 1
          fi
          if grep -R -q "0.30 means 30%" pricing-tool/dist/assets; then
            echo "Old English percentage example remains in built assets" >&2
            exit 1
          fi
          echo "built output verification passed"

      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/finalize-money-percent-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html pricing-tool .github/workflows/finalize-money-percent-current.yml
          git commit -m "Finalize money and percent formatting"
          git push origin HEAD:fix/currency-percent-formatting
